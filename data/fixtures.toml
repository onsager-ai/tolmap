# The nine acceptance fixtures in this directory (data/*.json), pinned.
#
# The compact viewer schema they are written in has no `params` block and no
# commit field -- `pipeline.run()` emits one and `blobs.build()` drops it
# during compaction -- so the committed JSON alone cannot tell you what was
# indexed to produce it (issue #2). The `commit` below is what makes each
# fixture an oracle rather than a snapshot: check the clone out at that SHA,
# seed the naming cache (eval/seed_names.py), rebuild with the given `pkg`/
# `lang`/`parcels`, and the output must be byte-identical to data/<name>.json.
# eval/verify_fixtures.py automates exactly that.
#
# `files`, `districts` and `q` (modularity) are read out of the committed
# fixture, not asserted independently -- they are here so a drifted rebuild
# is obvious from this file alone, without opening the JSON.
#
# `parcels` records whether the fixture was built with the weighted-Voronoi
# plot layer (the `P` key). Only flask and sqlalchemy were: the other seven
# were recorded with `--no-parcels`. That split is a real inconsistency in
# the corpus, not a normalisation to paper over -- see docs/ARCHITECTURE.md.
#
# leidenalg/igraph versions this file's SHAs were last verified against:
# igraph 1.0.0, leidenalg 0.12.0.
#
# `files`, `districts` and `q` for celery, django, flask, httpx, rich,
# scrapy and sqlalchemy were re-derived on 2026-09-19 after issue #12's
# relative-import fix (finding 12): the corrected resolver recovers real
# import edges the old one silently dropped, which changed membership and
# therefore reopened the naming cache on most districts -- see finding 12
# for the before/after table and the renamed districts. prometheus was
# untouched: its single root go.mod made nested-module resolution a no-op.
# Vue was re-derived on 2026-09-21 after issue #41's non-relative-import fix:
# 23.7% of its internal imports use @vue/* workspace names, so its graph and
# membership changed. See finding 15 for the before/after and rename tables.
#
# On 2026-09-23 issue #57 changed the Rust product default to node-relative
# pruning, a route the frozen Python reference does not implement. sqlalchemy
# and prometheus are the only fixtures whose membership moves under that
# default. They were rebuilt by the Rust product on GitHub-hosted runners with
# their old naming caches seeded first; see finding 23 and Remote build
# 35756191891. The other seven remain Python-reference fixtures and were not
# changed. `generator = "rust-node-relative"` makes that boundary explicit to
# `eval/verify_fixtures.py` instead of pretending Python can reproduce it.
#
# On 2026-09-26 the Rust hand resolver stopped crediting a package's
# `__init__.py` for `from pkg import submodule` and began crediting a
# re-exported name to the file that defines it (issue #110, owner decision
# "Tune hand, SCIP as oracle"; finding 49). The frozen Python reference does
# neither, so celery, django, flask, rich, scrapy and sqlalchemy were rebuilt
# by the Rust product at their pins with their naming caches seeded first, by
# ci.yml's `hand-score` job on the full-history clone `full-fixtures` uses.
# Not remote-build.yml: its depth-4000 clone builds django at 75.2% against
# its own fixture even with an unchanged binary. Each keeps the committed
# fixture's key set, and `generator = "rust-python-reexports"` marks them.
# httpx's graph did not change (its package imports are star imports), and
# neither did Go or TypeScript.
#
# Later on 2026-09-26 the Rust hand resolver stopped linking a Go import to
# every file of the imported package: it links the files that declare the
# names the importer selects, where each name is declared in exactly one
# file, and keeps the whole package otherwise (issue #110, finding 50). The
# frozen Python reference has no Go at all, so prometheus was rebuilt the
# same way, by `hand-score` at its pin with its naming cache seeded first,
# and `generator = "rust-go-declarations"` marks it. The Python and
# TypeScript fixtures are unchanged.

