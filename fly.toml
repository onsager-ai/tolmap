# Fly.io deployment -- PRODUCTION. Staging is Railway; see docs/DEPLOY.md
# for which target carries what and why the two exist.
#
# Applied 2026-09-20: app `tolmap` (org core-digital) is live, release v1,
# deployed by hand. Deploys are NOT automatic on merge -- prod moves only
# on a pushed `v*` tag or a manual dispatch of .github/workflows/
# fly-deploy.yml, because a deploy replaces the single machine below and
# any index job running at that moment dies with it (see the
# auto_stop_machines comment further down for the same failure mode).
#
# Changed 2026-09-24 (issue #110, owner decision via AskUserQuestion,
# session 16030105, transcript line 4551, 2026-09-24T06:51:34Z:
# "performance-2x / 16 GB, stopping when idle"): the machine is now sized
# for SCIP indexing (see the [[vm]] comment) and stops itself when idle
# instead of running 24x7 (see the auto_stop_machines comment below). This
# is a config-only change -- no Rust or Dockerfile changes -- and takes
# effect only on the next `v*` tag deploy; it is not live until then.
#
# One machine, one volume. The job queue and the SSE progress channel both
# live in-process (src/service/jobs.rs, an in-memory JobRegistry) -- there
# is no cross-machine state, so this is not "one machine for now, scale
# out later" but a real constraint: a second machine would have its own
# job registry and its own idea of what's running, and Fly's proxy does
# not know to route a job's follow-up requests (GET /api/jobs/{id}, the
# SSE stream) back to the machine that accepted it. (There is also no
# wall-time cap on a job's own runtime any more -- #97/#105 removed the
# file-count/clone-size/history-depth/job-time admission caps that used to
# bound this; see docs/API.md's "no admission caps" line and
# docs/ARCHITECTURE.md's "Capacity policy." That is an owner ruling to
# revisit there, not something reintroduced by this change -- flagged here
# only because a stalled job now has no self-imposed ceiling either,
# which compounds the auto-stop risk below rather than bounding it.)

app = "tolmap" # Live: org core-digital, first deployed 2026-09-20.

# iad (Ashburn, VA) -- chosen for proximity to where this service actually
# spends its time, not for user latency. The MVP is "paste a URL, wait for
# a clone + index job," so the dominant cost is round-trip latency and
# throughput to GitHub during `git clone --filter=blob:none`
# (docs/ARCHITECTURE.md's clone strategy) and `git fetch`, not the
# millisecond difference in where an interactive HTTP request originates.
# US East is the closest big Fly region to GitHub's own primary US
# infrastructure; if most real traffic turns out to be clustered elsewhere,
# this is the first knob to revisit, not the VM size.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8787 # matches TOLMAP_PORT's own default (docs/API.md) --
                        # left unset below rather than duplicated.
  force_https = true

  # Changed 2026-09-24 (issue #110): owner decision was explicitly
  # "stopping when idle" (see the top-of-file comment for the citation),
  # overriding the design doc's own recommendation (docs/SCIP_SANDBOX.md
  # #117 S5.4, "shape B is the cheaper bridge") to keep the always-on
  # shape. `auto_stop_machines`/`auto_start_machines` use the string form
  # Fly's docs use today (docs.fly.io/launch/autostop-autostart/,
  # docs.fly.io/reference/configuration/#the-http_service-section, both
  # fetched 2026-09-24): "off"/"stop"/"suspend", not a bare boolean.
  # "stop" (not "suspend") is used here -- suspend is Fly's own faster-
  # resume variant of the same underlying risk below, and Fly's docs flag
  # it with caveats of its own; there is no reason to add a second set of
  # unverified behaviour on top of the one this comment already has to be
  # honest about. `min_machines_running = 0` is required for
  # `auto_stop_machines` to have any effect (Fly's docs: it "has no effect
  # unless auto_stop_machines is stop or suspend") and is what lets the
  # single machine actually reach zero when idle.
  #
  # THE UNRESOLVED RISK, stated plainly rather than papered over: a
  # running index job (jobs::spawn_job) lives entirely in this process's
  # memory -- the job registry and the SSE watch::Sender -- none of it
  # persisted anywhere a stopped-then-restarted machine could recover it
  # from. A client can `POST /api/index`, get a job id back, and never open the
  # SSE stream (`GET /api/jobs/{id}/events`) or poll `GET
  # /api/jobs/{id}` again until later (docs/API.md). Fly Proxy's
  # auto-stop decision is driven by connection/request traffic to the
  # Machine, not by anything this app knows about a job in progress
  # (docs.fly.io/reference/fly-proxy-autostop-autostart: the proxy stops a
  # Machine once it sees no traffic / "a load of 0"); the design doc
  # (#117 S5.3) already flagged this in its own words: "Fly Proxy's own
  # stop does not know about in-flight jobs." So a job that nobody is
  # actively watching can be stopped mid-run with no client connection
  # open at all, not only mid-stream.
  #
  # `kill_signal`/`kill_timeout` (docs.fly.io/reference/configuration/,
  # fetched 2026-09-24) are the one Fly-documented lever for giving a
  # Machine time to react before a forced stop -- default signal SIGINT,
  # default timeout 5s, capped at 300s, and Fly's own docs call this
  # "best-effort... your app needs to be prepared to handle shorter
  # stopping times." Left unset (both still default): this comment used to
  # say the codebase installed no SIGINT/SIGTERM handler at all, so any
  # grace window was wasted. That is fixed by
  # https://github.com/onsager-ai/tolmap/pull/123 (branch
  # `fix/graceful-stop-keepalive`) -- **#123 must merge before this PR
  # (#120) does**. Its handler's shutdown work (fail every queued/running
  # job, kill worker children, push a final SSE frame) is a synchronous,
  # in-memory sweep that completes in well under a second, so the default
  # 5s timeout is already enough; nothing here depends on raising it.
  #
  # Mitigation status, updated now that #123 exists (read precisely -- it
  # narrows this risk, it does not eliminate the underlying auto-stop
  # behaviour above, and one open question below is now an OWNER DECISION,
  # not something either PR resolves on its own).
  #
  # #123 ships a real graceful-shutdown handler (the kill_signal/kill_timeout
  # paragraph above): on SIGINT/SIGTERM the service stops admitting new jobs
  # (503 `server_stopping`) and fails every job in flight with that same new
  # error code before the process exits, so a client watching (SSE or
  # polling) sees a clean terminal failure instead of the job silently
  # vanishing. This is what actually closes the "silent" half of the
  # original risk: a job can still be *interrupted* by an auto-stop mid-run,
  # but it is no longer invisible when that happens -- the caller gets a
  # real failure event instead of a hang. Blast radius is further bounded by
  # TOLMAP_MAX_CONCURRENT_JOBS = "1" below: at most one job in flight per
  # machine, so a mid-job stop is "one job cleanly fails for its one
  # caller," not a silent, service-wide loss of state.
  #
  # #123 also investigated, but deliberately did NOT ship, an in-process fix
  # for the *interruption itself* (as opposed to its silence). A periodic
  # keep-alive ping was built first, then removed once Fly's own docs
  # (docs.fly.io/blueprints/long-running-tasks/) confirmed it doesn't work:
  # "sending a successful HTTP request every 60 seconds from a machine to
  # its own <app>.fly.dev hostname does not prevent autostop." The natural
  # replacement -- holding one long-lived connection open through the
  # public proxy so Fly Proxy's own concurrency-based load measurement
  # stays nonzero -- was investigated and NOT built either: architecturally
  # plausible (Fly's docs say `http_service.concurrency` "configures how to
  # measure load ... for ... autostop/autostart"), but never confirmed for
  # this exact case, and contradicted by an unresolved community report of
  # a Machine auto-stopping despite an open WebSocket held for 4+ hours
  # (community.fly.io/t/server-auto-scaling-despite-websocket-connection/19900).
  # Shipping that on unverified footing was judged worse than not shipping
  # it. See PR #123's description for the full research trail.
  #
  # What remains is a real choice between two options, presented to the
  # owner rather than picked here:
  #   (a) don't auto-stop this app at all (`auto_stop_machines` off --
  #       this whole section reverts) -- costs more, removes the risk
  #       category outright; or
  #   (b) have the service call the Fly Machines API to suspend/lift
  #       auto-stop around a job's lifetime -- needs a Fly API token as a
  #       new credential (owner's call, not wired up here).
  # Until that's decided, this file keeps `auto_stop_machines = "stop"` as
  # the owner's original 2026-09-24 decision (top-of-file citation) said,
  # on the understanding that #123's graceful-stop handling is what makes
  # that decision survivable rather than silent.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/healthz"

[[vm]]
  size = "performance-2x"
  # Changed 2026-09-24 (issue #110, owner decision cited at the top of
  # this file): up from shared-cpu-1x/1gb. Sizing is for SCIP indexing
  # (#110's P1a/P1b), not for the current hand-written resolver alone --
  # see docs/SCIP_SANDBOX.md (#117, design for owner review) S5.1/S5.4 for
  # the numbers this is drawn from. performance-2x/16gb fits every P0
  # repository's measured peak RSS under the recommended install policy,
  # including n8n's scip-typescript at 8.84 GB and dify's scip-python
  # rooted at api/ at 7.17-7.89 GB. Where it would still OOM is inference
  # from two data points per indexer, not a measurement (#117 S5.4): a
  # roughly 14 GB working budget (16 GB minus a few hundred MB for
  # tolmap serve itself) runs out near ~5k files for a Python root or
  # ~20-25k files for a TypeScript root. Revisit the size, not just this
  # comment, if a real job OOMs short of those figures.
  memory = "16gb"

[[mounts]]
  source = "tolmap_data"
  destination = "/data"
  # 10 GB volume for SQLite, maps and the evicting clone cache.
  initial_size = "10gb"

[env]
  # Off-box binding, opt-in as of 2026-09-20 (src/service/config.rs) --
  # 0.0.0.0 so Fly's proxy on the same machine can reach the process at
  # all; TOLMAP_PORT is left at its default (8787) rather than duplicated
  # here, since it already matches internal_port above.
  TOLMAP_BIND_ADDR = "0.0.0.0"

  # Both on the volume, not the container filesystem -- anything else is
  # lost on every deploy, and losing the store specifically costs district
  # retention (docs/FINDINGS.md finding 4: the warm start reads the
  # previous commit's membership out of the store).
  TOLMAP_DB_PATH = "/data/tolmap.sqlite3"
  TOLMAP_CACHE_DIR = "/data/cache"

  # Owner-approved default from issue #57. Keep this explicit so production
  # cannot retain the old absolute floor through configuration drift.
  TOLMAP_PRUNE_VARIANT = "node-relative"

  # Clone cache eviction is a disk budget, not a single-repository cap.
  # The active clone is retained even when it exceeds this budget.
  TOLMAP_CLONE_CACHE_BYTES = "1073741824" # 1 GiB
  TOLMAP_MAX_CONCURRENT_JOBS = "1"
  TOLMAP_MAX_QUEUED_JOBS = "16"

  # Rate limits unchanged from the developer defaults -- these bound
  # request/clone *frequency*, not standing disk or memory, and the
  # per-repo limit (3 per 5 minutes) already keeps a single hot repo from
  # thrashing the LRU clone cache regardless of box size.
  TOLMAP_RATE_LIMIT_PER_IP = "30"
  TOLMAP_RATE_LIMIT_WINDOW_SECONDS = "60"
  TOLMAP_RATE_LIMIT_PER_REPO = "3"
  TOLMAP_RATE_LIMIT_PER_REPO_WINDOW_SECONDS = "300"

  # Down from the developer default of 20. Retained maps are NOT bounded
  # in total by this setting -- it caps disk per *slug* (repo), not across
  # the whole store, and a public multi-tenant index has no cap on how
  # many distinct slugs it will eventually see (see the PR body's
  # arithmetic for why this is flagged as an open concern rather than
  # something this change closes). 5 still satisfies docs/FINDINGS.md
  # finding 4's actual requirement -- the single newest row per slug is
  # never pruned regardless of this value (service::store::Store::prune)
  # -- while shrinking the worst case per repo from 20 map files to 5.
  TOLMAP_RETAIN_COMMITS_PER_REPO = "5"
