[package]
name = "tolmap"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Turn a source repository into a deterministic code map"
build = "build.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
libm = "=0.2.15"
rand = "=0.9.2"
rand_mt = "=6.0.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha1 = "=0.10.6"
toml = "=0.8.23"
tree-sitter = "=0.25.10"
tree-sitter-go = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }

[build-dependencies]
cc = "=1.4.7"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "tolmap"
path = "src/main.rs"

[[bin]]
name = "generate-types"
path = "src/bin/generate_types.rs"

