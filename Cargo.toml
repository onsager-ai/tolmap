[package]
name = "tolmap"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Turn a source repository into a deterministic code map"
build = "build.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
# `libc::geteuid()` -- std has no safe way to ask "am I root", and dropping
# the worker child to an unprivileged uid/gid (service::jobs::process_worker_exe)
# needs to know that before deciding whether CommandExt::uid()/gid() is even
# callable (it errors under a non-root caller). Already in Cargo.lock as a
# transitive dependency at this exact version; pinned explicitly here rather
# than left implicit now that this crate calls into it directly.
libc = "=0.2.189"
libm = "=0.2.15"
rand = "=0.9.2"
rand_mt = "=6.0.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha1 = "=0.10.6"
toml = "=0.8.23"
tree-sitter = "=0.25.10"
tree-sitter-go = "=0.25.0"
tree-sitter-python = "=0.25.0"
# Issue #126: Rust as a source language. 0.24.2 is the first release built
# against tree-sitter 0.25 (its dev-dependency is `tree-sitter = "^0.25"` and
# its parser.c is ABI 15, inside 0.25.10's 13..=15 window). It depends only on
# `tree-sitter-language ^0.1` and `cc ^1.1`, both already locked here, so the
# lockfile gains exactly this one package.
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
# Milestone 3 (job service, issue #5) additions below. Kept to five crates:
# an async runtime and HTTP framework are unavoidable for a service with SSE
# and concurrent jobs; the rest are thin single-purpose wrappers rather than
# hand-rolled ad hoc.
#   axum          -- routing, JSON extraction, and the SSE response type used
#                    by GET /api/jobs/{id}/events.
#   tokio         -- axum's runtime; also used directly for the job queue
#                    (spawned tasks), the per-job wall-time cap
#                    (`tokio::time::timeout`), and shelling out to `git`
#                    without blocking the runtime (`tokio::process::Command`).
#   rusqlite      -- the store (SQLite, per docs/ARCHITECTURE.md). "bundled"
#                    compiles SQLite in rather than requiring a system
#                    libsqlite3, which this sandbox does not have.
#   uuid          -- job ids. v4 (random) is enough; jobs are not queried by
#                    time-ordering, only by id.
#   tokio-stream  -- `ReceiverStream`, used to turn the per-connection mpsc
#                    channel GET /api/jobs/{id}/events relays a job's
#                    `watch::Receiver` through into the `Stream` axum's SSE
#                    response wants.
# Issue #97 phase 1 (owner decision, WORKER_TIER.md §10.2 "WebSocket on
# axum"): the agent dials the master over WebSocket. "ws" is the axum-side
# half (the upgrade extractor in src/service/http.rs); it pulls in axum's own
# `tokio-tungstenite` (currently 0.29.0 -- see the direct dependency below,
# which pins the client half to the exact same version and unifies on it).
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "signal"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
tokio-stream = "=0.1.19"
# Issue #97 phase 1: the agent's client side of the worker WebSocket channel
# (dialing the master, per WORKER_TIER.md §10.2). Pinned "=0.29.0" because
# that is the exact version axum 0.8.9's own "ws" feature resolves
# `tokio-tungstenite = "0.29.0"` to today (0.30.0 exists on crates.io but is
# outside axum's `^0.29.0` requirement) -- pinning the same version keeps one
# copy in Cargo.lock instead of two. TLS: `ureq =3.4.2`'s "rustls" feature
# already locks rustls 0.23.45 on the `ring` crypto provider with
# `webpki-roots` 1.0.9 as the trust store (ureq's own features:
# `_ring = ["rustls?/ring"]` and `rustls-webpki-roots = ["dep:webpki-roots"]`,
# and neither `aws-lc-rs` nor `rustls-native-certs` appears in Cargo.lock).
# `rustls-tls-webpki-roots` reuses that same `rustls` package (feature
# unification keeps `ring`, no `aws-lc-rs` is added) and its "webpki-roots"
# adds only webpki-roots 0.26.11, which as of that release is itself a thin
# forwarding shim depending on the already-locked webpki-roots 1.0.9 -- so
# there is one rustls, one crypto provider and one root store, not two.
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-webpki-roots"] }
# Fly.io deployment (2026-09-20): tolmap serves the built web bundle from
# the same axum process as the API when TOLMAP_STATIC_DIR is set, so a
# single always-on machine is one origin instead of two (see
# src/service/http.rs). tower-http's `ServeDir`/`ServeFile` is the ordinary
# way to do that; `tower` itself was already a dev-dependency (see below),
# this is what promotes static-file serving into a real one. "fs" is the
# static-file feature. Gzip covers API responses and this same static bundle.
tower-http = { version = "=0.7.1", features = ["fs", "compression-gzip"] }
# Issue #62: one blocking HTTPS call per map in the already-blocking build.
# ureq keeps the client small, rustls avoids a system TLS dependency, and
# serde_json (already above) owns both the request and untrusted response.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
# Issue #110 P1a: `tolmap build --refs scip` reads the index.scip files the
# SCIP indexers write (src/scip_ingest.rs). `scip` is the protocol's own
# generated Rust binding; 0.10.0 is generated from the same `scip.proto` tag
# (v0.10.0) that P0's Python oracle (eval/scip_ingest.py) decodes with, so
# the product ingest and the oracle read one schema. `scip` pins
# `protobuf = "=3.7.2"` itself (its generated code asserts VERSION_3_7_2 at
# compile time). tolmap names that exact version too because it calls
# `protobuf::Message::parse_from_bytes` directly, one `Document` at a time,
# rather than materialising a whole `Index` (n8n's is 583 MB). In the
# default build: this is product code now, not a measurement feature.
protobuf = "=3.7.2"
scip = "=0.10.0"
# Issue #97 phase 1, owner decision "Add sha2, per-file uploads": the agent
# hashes each uploaded artifact file with SHA-256 so the master can verify
# what it received. RustCrypto's sha2 on the 0.10 line, not 0.11: 0.11 is a
# coordinated major bump of RustCrypto's trait crates and would lock a second
# `digest` stack (7 crates) next to the 0.10 one `sha1` above already uses.
# 0.10.9 reuses that stack and adds only itself.
sha2 = "=0.10.9"

[build-dependencies]
cc = "=1.4.7"

[dev-dependencies]
tempfile = "=3.27.0"
# tower::ServiceExt::oneshot -- drives the axum Router directly in
# tests/service_hardening.rs without binding a real socket. Already in
# Cargo.lock as an axum dependency; pinning the same version here just
# makes it a dev-dependency too rather than pulling anything new in.
tower = { version = "=0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "tolmap"
path = "src/main.rs"

[[bin]]
name = "generate-types"
path = "src/bin/generate_types.rs"
