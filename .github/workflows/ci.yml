# Why this workflow is split into two jobs, not one:
#
# CLAUDE.md requires the clustering acceptance gate ("place >= 95% of files
# in the district the reference assigns, modularity within 0.02") in CI from
# the first commit of the clustering module. The gate needs a candidate map
# built from an actual repository -- but the nine fixtures this project's
# acceptance data (`data/*.json`) was measured against include django (851
# files, full git history for co-change) and are not something CI should
# clone on every push: it is slow, it hammers nine upstream repositories on
# every commit, and none of that cost buys anything a push-time check needs.
#
# So:
#   - `gate` runs on every push and pull request. It builds the Rust, checks
#     formatting and lints, runs the unit test suite, and runs the real
#     parity gate -- but offline, against `data/ci/{flask,httpx}.graph.json`,
#     pre-extracted graphs checked into the repo for the two smallest
#     fixtures (flask: 24 files, httpx: 23). `tolmap build --graph` runs
#     blend -> prune -> partition -> layout -> parity on a checked-in graph
#     without touching a network or a git clone. This is a real instance of
#     the same gate (same code path, same thresholds), just scoped to what
#     is reproducible without cloning.
#   - `full-fixtures` runs the complete nine-repository suite from
#     `docs/FINDINGS.md`'s corpus, on `workflow_dispatch` (on demand) and
#     nightly. It clones each fixture at a pinned commit (blobless, per
#     `docs/ARCHITECTURE.md`'s documented clone strategy -- co-change needs
#     full commit history, so a shallow clone is not enough) and runs the
#     same parity gate as `gate`, against the checked-in `data/*.json`.
#
# A known gap, reported rather than hidden -- corrected from what an earlier
# version of this comment said. That version claimed `full-fixtures` was
# expected to be RED on four of nine fixtures (scrapy, celery, rich,
# prometheus) because Leiden's local-moving optimisation is "highly sensitive
# to the exact micro-sequence of RNG draws on a weakly modular graph," an
# inherent property of the algorithm that only a native-Rust reimplementation
# could fix. That was wrong, and cheaply falsifiable: the Rust FFI bridge
# (`native/leiden_bridge.cpp`) built a libleidenalg `Optimiser` and set only
# its RNG seed, leaving `refine_consider_comms` (and six other fields) at the
# bare C++ constructor's default -- which is NOT what `leidenalg`'s Python
# `Optimiser` (what the reference actually calls) sets it to. Refinement is
# the phase that distinguishes Leiden from Louvain, so the port was running a
# different search over an identical graph, not hitting inherent chaos.
# Pinning those seven fields to match `la.find_partition()`'s own defaults
# (`docs/FINDINGS.md` finding 11) took placement on those four fixtures from
# 67-82% to 100%, and modularity from drifting up to 0.0129 off the reference
# to matching it to four decimal places, on all nine fixtures.
#
# An earlier version of this comment said one narrower gap remained and that
# this job was "still expected to be RED because of it": sqlalchemy placing
# 98.4% of files (not 100%) in the district the reference assigns, with
# `dialects/` splitting 4 files into their own community. That is no longer
# true, and was corrected here rather than left to mislead the next reader.
# `docs/FINDINGS.md` finding 12 -- the relative-import fix, which resolved
# Python relative imports one package level too deep on both sides -- changed
# the graph enough that sqlalchemy converges too: 100.0% district placement
# and 0.0000 modularity delta on all nine fixtures, with F/E/L/S/U
# byte-identical. Finding 12 is careful about what that does and does not
# establish: it does not prove the underlying Leiden local-moving divergence
# is closed, only that the corrected graph no longer exercises it.
#
# So this job is now expected to be GREEN on all nine. Treat a red run as a
# real regression to investigate, not as the known-red state this comment
# used to describe.
#
# Stated honestly, because the expectation above is a prediction and not an
# observation: at the time of writing, `gh run list --event=schedule` returns
# nothing -- no nightly run of this job has ever fired, so neither the old
# red expectation nor this green one has been confirmed by an actual
# scheduled run. The first nightly to complete is the thing that settles it.
#
# Coordinates are deliberately outside this gate and always will be; see
# finding 11's "Ruling, 2026-09-20" section and `src/parity.rs`.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scip_churn:
        description: "Also run the SCIP churn diagnosis (finding 47, about 30 minutes)"
        type: boolean
        default: false
  schedule:
    # 03:17 UTC nightly -- off the hour to avoid the top-of-hour GitHub
    # Actions scheduling crush.
    - cron: "17 3 * * *"

env:
  CARGO_TERM_COLOR: always
  LEIDEN_PREFIX: ${{ github.workspace }}/.native/leiden

jobs:
  gate:
    name: build, lint, offline parity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # igraph + libleidenalg are not something to vendor or fetch on every
      # run: scripts/install-leiden.sh builds them once from source, pinned
      # to the versions the script names, and the result is cached by a hash
      # of that script (the version pins live inside it, so a version bump
      # invalidates the cache automatically).
      - name: Cache native Leiden/igraph build
        id: cache-leiden
        uses: actions/cache@v4
        with:
          path: ${{ env.LEIDEN_PREFIX }}
          key: leiden-${{ runner.os }}-${{ hashFiles('scripts/install-leiden.sh') }}

      - name: Build native Leiden/igraph
        if: steps.cache-leiden.outputs.cache-hit != 'true'
        run: bash scripts/install-leiden.sh "${{ env.LEIDEN_PREFIX }}"

      - name: cargo fmt --check
        run: cargo fmt --check

      # Not -D warnings: the existing lints at HEAD are pre-existing style
      # suggestions (collapsible-match, too-many-arguments, ...), not
      # correctness issues, and turning them into a hard gate is a separate
      # decision from standing this workflow up. cargo clippy still runs and
      # its output is visible in the log.
      # --locked (issue #110 P1a): Cargo.lock is committed and the release
      # binary must build from exactly it. Without the flag a stale lock is
      # silently rewritten on the runner and the check proves nothing.
      - name: cargo clippy
        run: cargo clippy --locked --release --all-targets

      - name: cargo build
        run: cargo build --locked --release --bin tolmap

      - name: cargo test
        run: cargo test --locked --release

      - name: Generated TypeScript bindings
        run: cargo run --release --bin generate-types -- --check

      # `--refs hand` on every build in this job (issue #110 P2a). These
      # gates test the hand-written resolver -- the only one the frozen
      # Python reference knows -- and `hand` is also the default today, but
      # a pinned gate cannot be moved by a future change of default: had the
      # default been `scip`, each build here (no indexer installed) would
      # have been a silent all-fallback SCIP build. A `--graph` build ignores
      # `--refs` (its edges are already extracted); it is pinned anyway so no
      # gate here depends on what the default is. The `scip` job below tests
      # the SCIP path and that the default stays `hand`.
      - name: Offline parity gate (flask, httpx)
        run: |
          set -euo pipefail
          mkdir -p ci-out
          for name in flask httpx; do
            ./target/release/tolmap build \
              --graph "data/ci/${name}.graph.json" \
              --name "$name" \
              --out ci-out \
              --refs hand \
              --resolution 1.1
            ./target/release/tolmap parity "data/${name}.json" "ci-out/${name}.json"
          done

      # The union-extraction merge itself, offline: data/ci/synthetic_polyglot.graph.json
      # is `tolmap dump-graph --all-sources` run once against
      # eval/gen_synthetic_polyglot_fixture.py's output and checked in the
      # same way data/ci/{flask,httpx}.graph.json are. Not a parity check
      # (there is no oracle for polyglot -- docs/ARCHITECTURE.md) -- just
      # confirms `build --graph` still runs blend -> prune -> partition ->
      # layout on a merged multi-source graph without a repository or a
      # network call.
      - name: Offline union-extraction sanity (synthetic polyglot graph)
        run: |
          set -euo pipefail
          ./target/release/tolmap build \
            --graph data/ci/synthetic_polyglot.graph.json \
            --name synthetic_polyglot \
            --out ci-out \
            --refs hand \
            --resolution 1.1

      # Issue #41's resolver regressions: the original 51-file package keeps
      # its 50 @/... imports, and a second two-file package declares the same
      # alias and imports its own same-named target. Before the first fix the
      # graph was empty; before the scoped follow-up one root-package import
      # crossed into the second package. Generating source here keeps the
      # resolver, rather than a checked-in graph, under test.
      - name: Generate alias-only TypeScript fixture
        run: python3 eval/gen_synthetic_module_resolution_fixture.py --out module-resolution-fixture

      - name: Build alias-only TypeScript fixture
        run: |
          set -euo pipefail
          ./target/release/tolmap build "$PWD/module-resolution-fixture" \
            --pkg . --lang ts --refs hand --name module_resolution --out ci-out

      # docs/FINDINGS.md finding 13, step 2 of the polyglot work: materialise
      # the synthetic fixture fresh (pure local git + Python, no network),
      # then check the two things spec step 1 item 8 and step 2 require --
      # three `--all-sources` builds are byte-identical, and
      # `polyglot-report`'s numbers stay under the ceilings finding 13
      # records (eval/check_polyglot_ceilings.py). ubuntu-latest ships
      # python3; nothing here needs a version pin beyond what the stdlib
      # `tomllib`-free scripts already assume.
      - name: Generate synthetic polyglot fixture
        run: python3 eval/gen_synthetic_polyglot_fixture.py --out polyglot-fixture

      - name: Polyglot determinism (--all-sources, 3x sha256)
        run: |
          set -euo pipefail
          hashes=""
          for i in 1 2 3; do
            mkdir -p "polyglot-det-$i"
            ./target/release/tolmap build "$PWD/polyglot-fixture" --all-sources --refs hand \
              --name synthetic_polyglot --out "polyglot-det-$i" >/dev/null
            hash=$(sha256sum "polyglot-det-$i/synthetic_polyglot.json" "polyglot-det-$i/synthetic_polyglot.symbols.json" | cut -d' ' -f1 | sha256sum | cut -d' ' -f1)
            echo "run $i: $hash"
            hashes="$hashes $hash"
          done
          uniq_count=$(echo "$hashes" | tr ' ' '\n' | sort -u | grep -c .)
          if [ "$uniq_count" -ne 1 ]; then
            echo "three --all-sources runs produced different output -- determinism regression (CLAUDE.md, finding 9)"
            exit 1
          fi
          echo "three --all-sources runs byte-identical"

      - name: Polyglot report + ceilings (finding 13)
        run: |
          set -euo pipefail
          ./target/release/tolmap polyglot-report "$PWD/polyglot-fixture" --all-sources \
            --out polyglot-report.json
          python3 eval/check_polyglot_ceilings.py polyglot-report.json

      # docs/FINDINGS.md finding 17 (issue #34): the three district classes.
      # None of the nine acceptance fixtures can exercise this -- eight have
      # no sub-1% district at all, and the ninth (prometheus) is not built on
      # this job's offline path -- so the fixture is generated here, the same
      # way the polyglot one above is, and checked against the counts its
      # generator constructs by hand. Not a parity check: there is no
      # reference implementation of classification to compare against.
      - name: Generate synthetic islands fixture
        run: python3 eval/gen_synthetic_islands_fixture.py --out islands-fixture

      - name: Islands classification (finding 17)
        run: |
          set -euo pipefail
          ./target/release/tolmap build "$PWD/islands-fixture" --pkg . --lang py --refs hand \
            --name synthetic_islands --out islands-out >/dev/null
          python3 eval/check_islands_fixture.py islands-out/synthetic_islands.json

      - name: Footprint hard targets on offline and synthetic maps
        run: |
          set -euo pipefail
          for name in flask httpx synthetic_polyglot module_resolution; do
            echo "footprint metrics: $name"
            python3 eval/footprint_metrics.py "ci-out/${name}.json" --gate \
              --out "ci-out/${name}.footprint-metrics.json"
          done
          echo "footprint metrics: synthetic_islands"
          python3 eval/footprint_metrics.py islands-out/synthetic_islands.json --gate \
            --out islands-out/synthetic_islands.footprint-metrics.json

      - name: Audit symbol cards and static district files
        run: python3 eval/symbol_stats.py islands-out/synthetic_islands.json islands-out/synthetic_islands.symbols.json

      # The hand-versus-SCIP classifier (finding 48), on a synthetic package
      # with one pair of each class; the real scores run in `hand-score`.
      - name: Hand-score classifier self-test
        run: python3 eval/hand_score.py self-test

      # Issue #126 (finding 56): Rust extraction and module-tree resolution,
      # three builds of this checkout's own Rust (the resolver's unit tests
      # hold a synthetic Cargo workspace's exact edges). The map and the
      # symbols document must be byte-identical every time (CLAUDE.md,
      # finding 9). A depth-1 checkout has one commit, so co-change is
      # trivial here; determinism of the resolver is what this checks.
      - name: Rust determinism (this checkout, --lang rs, 3x sha256)
        run: |
          set -euo pipefail
          hashes=""
          for i in 1 2 3; do
            mkdir -p "rust-det-$i"
            TOLMAP_RUST_IMPORT_REPORT="$PWD/rust-det-$i" ./target/release/tolmap build "$PWD" \
              --pkg . --lang rs --refs hand --name tolmap --out "rust-det-$i" > "rust-det-$i.log" 2>&1 \
              || { tail -30 "rust-det-$i.log"; exit 1; }
            hash=$(sha256sum "rust-det-$i/tolmap.json" "rust-det-$i/tolmap.symbols.json" \
              "rust-det-$i/rust-imports.root.json" | cut -d' ' -f1 | sha256sum | cut -d' ' -f1)
            echo "run $i: $hash"
            hashes="$hashes $hash"
          done
          uniq_count=$(echo "$hashes" | tr ' ' '\n' | sort -u | grep -c .)
          if [ "$uniq_count" -ne 1 ]; then
            echo "three --lang rs builds produced different output -- determinism regression (CLAUDE.md, finding 9)"
            exit 1
          fi
          python3 - <<'PY'
          import json
          doc = json.load(open("rust-det-1/tolmap.json"))
          print(f"three --lang rs builds byte-identical: {len(doc['F'])} files, "
                f"{len(doc['E'])} edges, {len(set(n[0] for n in doc['N']))} districts, q {doc['q']}")
          PY

      # The `scip` job below reuses this binary rather than compiling again.
      # build.rs bakes $LEIDEN_PREFIX/lib in as the rpath; the libraries
      # travel with it and are restored to the same path there.
      - name: Upload binary for the SCIP job
        uses: actions/upload-artifact@v4
        with:
          name: ci-tolmap-binary
          path: target/release/tolmap
          if-no-files-found: error
          retention-days: 3

      - name: Upload Leiden runtime libs for the SCIP job
        uses: actions/upload-artifact@v4
        with:
          name: ci-leiden-lib
          path: ${{ env.LEIDEN_PREFIX }}/lib
          if-no-files-found: error
          retention-days: 3

  # Issue #110 P1a: `tolmap build --refs scip` must be as deterministic as
  # the hand-written path -- three builds, byte-identical map and symbols
  # document (CLAUDE.md, finding 9) -- with the real indexers doing real
  # work. The pinned indexer versions are P0's (scip-spike.yml, finding 41).
  # Both synthetic fixtures are generated fresh, as the gate job does: the
  # polyglot one covers scip-go and scip-typescript, the islands one
  # scip-python. `check_scip_references.py` asserts every language actually
  # took the SCIP path, since a build that fell back everywhere would be
  # deterministic without testing anything. Nothing is installed from the
  # fixtures (they have no dependencies), and the build itself runs with the
  # no-install policy src/indexers.rs enforces.
  scip:
    name: SCIP ingest determinism (--refs scip, 3x sha256)
    needs: gate
    runs-on: ubuntu-latest
    env:
      SCIP_TYPESCRIPT_VERSION: "0.4.0"
      SCIP_PYTHON_VERSION: "0.6.6"
      SCIP_GO_VERSION: "v0.2.7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-tolmap-binary
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: ci-leiden-lib
          path: ${{ env.LEIDEN_PREFIX }}/lib
      - run: chmod +x bin/tolmap
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install pinned indexers
        run: |
          set -euo pipefail
          npm install -g "@sourcegraph/scip-typescript@${SCIP_TYPESCRIPT_VERSION}" \
            "@sourcegraph/scip-python@${SCIP_PYTHON_VERSION}"
          go install "github.com/scip-code/scip-go/cmd/scip-go@${SCIP_GO_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate synthetic fixtures
        run: |
          set -euo pipefail
          python3 eval/gen_synthetic_polyglot_fixture.py --out polyglot-fixture
          python3 eval/gen_synthetic_islands_fixture.py --out islands-fixture
      - name: Three --refs scip builds per fixture are byte-identical
        env:
          LD_LIBRARY_PATH: ${{ env.LEIDEN_PREFIX }}/lib
        run: |
          set -euo pipefail
          scip-typescript --version; scip-python --version; command -v scip-go
          determinism() {
            name=$1; repo=$2; shift 2
            hashes=""
            for i in 1 2 3; do
              out="scip-det-$name-$i"
              mkdir -p "$out"
              if ! ./bin/tolmap build "$PWD/$repo" "$@" --refs scip \
                  --name "$name" --out "$out" > "$out/build.log" 2>&1; then
                cat "$out/build.log"
                exit 1
              fi
              grep -E '^references |Indexing .*done in' "$out/build.log" || true
              hash=$(cat "$out/$name.json" "$out/$name.symbols.json" | sha256sum | cut -d' ' -f1)
              echo "$name run $i: $hash"
              hashes="$hashes $hash"
            done
            if [ "$(echo "$hashes" | tr ' ' '\n' | sort -u | grep -c .)" -ne 1 ]; then
              echo "three --refs scip builds of $name differ -- determinism regression"
              exit 1
            fi
          }
          determinism synthetic_polyglot polyglot-fixture --all-sources
          python3 eval/check_scip_references.py scip-det-synthetic_polyglot-1/synthetic_polyglot.json \
            --symbols scip-det-synthetic_polyglot-1/synthetic_polyglot.symbols.json \
            --expect go=scip --expect ts=scip
          determinism synthetic_islands islands-fixture --pkg . --lang py
          python3 eval/check_scip_references.py scip-det-synthetic_islands-1/synthetic_islands.json \
            --symbols scip-det-synthetic_islands-1/synthetic_islands.symbols.json \
            --expect py=scip
      # Issue #110 P2a: `hand` stays the default (owner decision,
      # 2026-09-25T16:56Z: "Tune hand, SCIP as oracle"). A build that names no
      # `--refs` must be byte-identical to an explicit `--refs hand` build,
      # on a runner where every indexer is installed, so the default cannot
      # quietly start indexing. Every gate still pins `--refs hand` anyway.
      - name: The default build is --refs hand
        env:
          LD_LIBRARY_PATH: ${{ env.LEIDEN_PREFIX }}/lib
        run: |
          set -euo pipefail
          ./bin/tolmap build "$PWD/polyglot-fixture" --all-sources --refs hand \
            --name synthetic_polyglot --out refs-hand > hand.log 2>&1 || { cat hand.log; exit 1; }
          ./bin/tolmap build "$PWD/polyglot-fixture" --all-sources \
            --name synthetic_polyglot --out refs-default > default.log 2>&1 || { cat default.log; exit 1; }
          explicit=$(cat refs-hand/synthetic_polyglot.json refs-hand/synthetic_polyglot.symbols.json | sha256sum | cut -d' ' -f1)
          default=$(cat refs-default/synthetic_polyglot.json refs-default/synthetic_polyglot.symbols.json | sha256sum | cut -d' ' -f1)
          echo "explicit --refs hand: $explicit"
          echo "default:              $default"
          [ "$explicit" = "$default" ] || { echo "the default build differs from --refs hand"; exit 1; }

      - name: A missing indexer falls back instead of failing
        env:
          LD_LIBRARY_PATH: ${{ env.LEIDEN_PREFIX }}/lib
          TOLMAP_SCIP_GO: /nonexistent/scip-go
        run: |
          set -euo pipefail
          ./bin/tolmap build "$PWD/polyglot-fixture" --all-sources --refs scip \
            --name synthetic_polyglot --out scip-fallback > fallback.log 2>&1 || { cat fallback.log; exit 1; }
          python3 eval/check_scip_references.py scip-fallback/synthetic_polyglot.json \
            --expect go=hand --expect ts=scip

  # Issue #110 P1c: the sandboxed dependency install, for real, on a runner.
  # nsjail (built from its pinned tag), socat and pnpm are what the runtime
  # image carries (Dockerfile); `tolmap` runs as root through sudo, which is
  # what starting the jail needs, and the jail runs as the fixture's owner
  # (the runner user). It proves, on every push:
  #   - the jail reaches registry.npmjs.org and nothing else
  #     (tests/fixtures/sandbox/egress_check.js inside `tolmap sandbox-exec`);
  #   - an install into a pnpm workspace with one real npm dependency runs in
  #     the sandbox and is what admits TypeScript to the SCIP path: the same
  #     fixture without installs falls back to `hand` (its one cross-package
  #     import resolves only through node_modules);
  #   - three cold installs and builds give byte-identical maps;
  #   - a sandbox that cannot start (no nsjail; not root) and an install past
  #     its time or disk bound each fall back with the reason recorded, the
  #     build still succeeds, and no node_modules is left behind.
  scip-install:
    name: SCIP install sandbox (nsjail, --install sandbox, 3x sha256)
    needs: gate
    runs-on: ubuntu-latest
    env:
      SCIP_TYPESCRIPT_VERSION: "0.4.0"
      PNPM_VERSION: "12.6.0"
      NSJAIL_VERSION: "3.6"
      NSJAIL_COMMIT: "f78475530b46d0186111a9096b30725f816b55fe"
      LD_LIBRARY_PATH: ${{ github.workspace }}/.native/leiden/lib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-tolmap-binary
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: ci-leiden-lib
          path: ${{ env.LEIDEN_PREFIX }}/lib
      - run: chmod +x bin/tolmap
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned scip-typescript and pnpm
        run: |
          set -euo pipefail
          npm install -g "@sourcegraph/scip-typescript@${SCIP_TYPESCRIPT_VERSION}" "pnpm@${PNPM_VERSION}"
          scip-typescript --version; pnpm --version
      - name: Cache nsjail
        uses: actions/cache@v4
        with:
          path: .nsjail
          key: nsjail-${{ runner.os }}-${{ env.NSJAIL_COMMIT }}
      - name: Build nsjail and install socat
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends socat autoconf bison flex \
            libprotobuf-dev libnl-route-3-dev libtool pkg-config protobuf-compiler
          if [ ! -x .nsjail/nsjail ]; then
            git clone --quiet --depth 1 --branch "$NSJAIL_VERSION" --recurse-submodules \
              --shallow-submodules https://github.com/google/nsjail.git "$RUNNER_TEMP/nsjail"
            test "$(git -C "$RUNNER_TEMP/nsjail" rev-parse HEAD)" = "$NSJAIL_COMMIT"
            make -C "$RUNNER_TEMP/nsjail" -j"$(nproc)" > "$RUNNER_TEMP/nsjail-build.log" 2>&1 \
              || { tail -50 "$RUNNER_TEMP/nsjail-build.log"; exit 1; }
            mkdir -p .nsjail && cp "$RUNNER_TEMP/nsjail/nsjail" .nsjail/
          fi
          sudo install -m 0755 .nsjail/nsjail /usr/local/bin/nsjail
          command -v socat nsjail
      - name: The jail reaches registry.npmjs.org and nothing else
        run: |
          set -euo pipefail
          mkdir -p egress-check
          cp tests/fixtures/sandbox/egress_check.js egress-check/
          sudo env "PATH=$PATH" "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" \
            ./bin/tolmap sandbox-exec --repo "$PWD/egress-check" -- node egress_check.js
      - name: Three sandboxed installs and builds are byte-identical, and the install is what admits TypeScript
        run: |
          set -euo pipefail
          fixture() {
            rm -rf "$1"
            cp -r tests/fixtures/scip/ts-workspace "$1"
            git -C "$1" init --quiet
            git -C "$1" add -A
            # Fixed dates: every copy is the same commit, so the three maps
            # can be compared byte for byte.
            GIT_AUTHOR_DATE=2026-01-01T00:00:00Z GIT_COMMITTER_DATE=2026-01-01T00:00:00Z \
              git -C "$1" -c user.name=ci -c user.email=ci@example.invalid commit --quiet -m fixture
          }
          as_root() { sudo env "PATH=$PATH" "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" "$@"; }
          hashes=""
          for i in 1 2 3; do
            fixture "ws-$i"
            if ! as_root ./bin/tolmap build "$PWD/ws-$i" --pkg . --lang ts --refs scip \
                --install sandbox --name ts_workspace --out "install-$i" > "install-$i.log" 2>&1; then
              cat "install-$i.log"; exit 1
            fi
            grep -E '^references |^install|egress|sandbox' "install-$i.log" || true
            hash=$(cat "install-$i/ts_workspace.json" "install-$i/ts_workspace.symbols.json" | sha256sum | cut -d' ' -f1)
            echo "sandboxed install build $i: $hash"
            hashes="$hashes $hash"
          done
          if [ "$(echo "$hashes" | tr ' ' '\n' | sort -u | grep -c .)" -ne 1 ]; then
            echo "three sandboxed-install builds differ -- determinism regression"; exit 1
          fi
          python3 eval/check_scip_references.py install-1/ts_workspace.json \
            --expect ts=scip --expect-install ts=installed
          # The install wrote the workspace link and the npm package, as the
          # fixture's owner rather than as root.
          test -L ws-1/packages/app/node_modules/@fixture/core
          test -f ws-1/packages/core/node_modules/tiny-invariant/package.json
          test "$(stat -c %u ws-1/packages/core/node_modules)" = "$(id -u)"

          # Without installs the same checkout falls back: scip-typescript
          # cannot resolve @fixture/core, so the index keeps too little of
          # the hand-written graph.
          fixture ws-plain
          ./bin/tolmap build "$PWD/ws-plain" --pkg . --lang ts --refs scip \
            --name ts_workspace --out plain > plain.log 2>&1 || { cat plain.log; exit 1; }
          grep -E '^references ' plain.log || true
          python3 eval/check_scip_references.py plain/ts_workspace.json \
            --expect ts=hand --expect-install ts=none
      - name: A sandbox that cannot start, and an install past its bounds, fall back without failing the build
        run: |
          set -euo pipefail
          fixture() {
            rm -rf "$1"
            cp -r tests/fixtures/scip/ts-workspace "$1"
            git -C "$1" init --quiet
            git -C "$1" add -A
            git -C "$1" -c user.name=ci -c user.email=ci@example.invalid commit --quiet -m fixture
          }
          as_root() { sudo env "PATH=$PATH" "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" "$@"; }
          fallback() {
            name=$1; reason=$2; shift 2
            fixture "fb-$name"
            if ! "$@" ./bin/tolmap build "$PWD/fb-$name" --pkg . --lang ts --refs scip \
                --install sandbox --name ts_workspace --out "fb-$name-out" > "fb-$name.log" 2>&1; then
              cat "fb-$name.log"; exit 1
            fi
            grep -E 'install|sandbox|egress' "fb-$name.log" || true
            python3 eval/check_scip_references.py "fb-$name-out/ts_workspace.json" \
              --expect ts=hand --expect-install "ts=fell_back:$reason"
            if find "fb-$name" -name node_modules -print -quit | grep -q .; then
              echo "the $name fallback left node_modules behind"; exit 1
            fi
          }
          # The sandbox cannot start: no nsjail, and not root at all.
          fallback no-nsjail sandbox_unavailable as_root TOLMAP_NSJAIL=/nonexistent/nsjail
          fallback not-root sandbox_unavailable env
          # The install passes its bounds: a tenth of a second, which no
          # install meets, and a one-byte disk budget.
          fallback timeout install_timeout as_root TOLMAP_INSTALL_TIME_LIMIT_S=0.1
          fallback disk install_disk_budget as_root TOLMAP_INSTALL_DISK_BUDGET_BYTES=1

  # Issue #110 P2a: SCIP is the oracle the hand resolver is tuned against
  # (owner decision, 2026-09-25T16:56Z: "Tune hand, SCIP as oracle"; hand
  # stays the default). `--refs scip` moves the membership the nine-fixture parity
  # oracle records (finding 45: 47.8-85.8% placement against the hand maps
  # where SCIP is admitted), so it cannot be gated against data/*.json.
  # `full-fixtures` below keeps gating the hand path there with `--refs
  # hand`; this job gates the SCIP path against fixtures re-derived under
  # it, data/scip/ (eval/scip_fixtures.py's header has the format and why it
  # is a summary), so the oracle itself cannot drift unnoticed.
  # Same pinned indexers as the `scip` job, the same pins and clone method as
  # `full-fixtures`, and the binary the `gate` job built.
  #
  # Every run also writes the hand-versus-SCIP table (the step summary and
  # the `scip-fixtures` artifact) and a fresh set of SCIP fixtures under
  # `record/` in that artifact. Committing those is how the SCIP fixtures
  # are re-derived: deliberately, with the finding that explains the move,
  # never by this job.
  scip-fixtures:
    name: SCIP nine-fixture gate (on demand / nightly)
    needs: gate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # django's scip-python run is about two minutes (finding 44); the other
    # eight are smaller. Bounded so a hung indexer cannot hold the runner.
    timeout-minutes: 120
    env:
      SCIP_TYPESCRIPT_VERSION: "0.4.0"
      SCIP_PYTHON_VERSION: "0.6.6"
      SCIP_GO_VERSION: "v0.2.7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-tolmap-binary
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: ci-leiden-lib
          path: ${{ env.LEIDEN_PREFIX }}/lib
      - run: chmod +x bin/tolmap
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install pinned indexers and /usr/bin/time
        run: |
          set -euo pipefail
          npm install -g "@sourcegraph/scip-typescript@${SCIP_TYPESCRIPT_VERSION}" \
            "@sourcegraph/scip-python@${SCIP_PYTHON_VERSION}"
          go install "github.com/scip-code/scip-go/cmd/scip-go@${SCIP_GO_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          command -v /usr/bin/time || { sudo apt-get update && sudo apt-get install -y time; }
      - name: Build each fixture with --refs hand and --refs scip
        env:
          LD_LIBRARY_PATH: ${{ env.LEIDEN_PREFIX }}/lib
        run: |
          set -uo pipefail
          scip-typescript --version; scip-python --version; command -v scip-go
          mkdir -p scip-fx/hand scip-fx/scip fx-clones
          python3 eval/scip_fixtures.py list > fixtures.txt
          while read -r name url sha pkg lang parcels; do
            echo "::group::$name"
            dir="fx-clones/$name"
            # Blobless, full history: the same clone `full-fixtures` builds.
            git clone --quiet --filter=blob:none "$url" "$dir"
            git -C "$dir" checkout --quiet "$sha"
            parcels_arg=""
            [ "$parcels" = "true" ] || parcels_arg="--no-parcels"
            for mode in hand scip; do
              if /usr/bin/time -v -o "scip-fx/$name.$mode.time.txt" \
                  ./bin/tolmap build "$PWD/$dir" --pkg "$pkg" --lang "$lang" --refs "$mode" \
                  $parcels_arg --name "$name" --out "scip-fx/$mode" > "scip-fx/$name.$mode.log" 2>&1; then
                echo "$name --refs $mode: built"
              else
                echo "$name --refs $mode: FAILED"; tail -20 "scip-fx/$name.$mode.log"
              fi
              grep -E '^references |Indexing .*: done in' "scip-fx/$name.$mode.log" || true
            done
            rm -rf "$dir"
            echo "::endgroup::"
          done < fixtures.txt
      - name: Measure SCIP against hand
        env:
          LD_LIBRARY_PATH: ${{ env.LEIDEN_PREFIX }}/lib
        run: |
          set -euo pipefail
          python3 eval/scip_fixtures.py measure --work scip-fx --tolmap bin/tolmap \
            --out scip-fx/measure.json --markdown scip-fx/measure.md
          cat scip-fx/measure.md >> "$GITHUB_STEP_SUMMARY"
      - name: Record fresh SCIP fixtures (artifact only)
        if: always()
        run: |
          python3 eval/scip_fixtures.py record --work scip-fx --out scip-fx/record \
            --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scip-fixtures
          path: |
            scip-fx
            !scip-fx/**/*.symbols.json
            !scip-fx/**/*.symbols
          retention-days: 30
      - name: Gate --refs scip against data/scip
        if: always()
        run: python3 eval/scip_fixtures.py gate --work scip-fx --summaries data/scip

  # Finding 47: why SCIP moves the districts (issue #110 P2a). Evidence, not
  # a gate: it never fails on a number, only on a build it could not run.
  # For each fixture it dumps the hand and SCIP graphs (`dump-graph --refs`),
  # rebuilds the partition from controlled variants of them through
  # `build --graph` (eval/scip_churn.py's docstring lists them: node-order
  # permutations as the seed proxy, random pair changes of SCIP's size as the
  # noise baseline, and SCIP's pair set and weights applied one at a time),
  # classifies the pairs each side has alone, and writes the owner's
  # side-by-side district lists. sqlalchemy, which falls back at recall
  # 0.6608 (finding 45), is re-indexed under two configuration-only changes
  # and its missed pairs are profiled with P0's ingest on the kept index.
  # Dispatch-only and behind an input, so neither nightly nor an ordinary
  # dispatch pays for it.
  scip-churn:
    name: SCIP churn diagnosis (on demand)
    needs: gate
    if: github.event_name == 'workflow_dispatch' && inputs.scip_churn
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SCIP_TYPESCRIPT_VERSION: "0.4.0"
      SCIP_PYTHON_VERSION: "0.6.6"
      SCIP_GO_VERSION: "v0.2.7"
      SCIP_PROTO_TAG: "v0.10.0"
      PROTOBUF_VERSION: "5.29.3"
      GRPCIO_TOOLS_VERSION: "1.70.0"
      SEEDS: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-tolmap-binary
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: ci-leiden-lib
          path: ${{ env.LEIDEN_PREFIX }}/lib
      - run: chmod +x bin/tolmap
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install pinned indexers
        run: |
          set -euo pipefail
          npm install -g "@sourcegraph/scip-typescript@${SCIP_TYPESCRIPT_VERSION}" \
            "@sourcegraph/scip-python@${SCIP_PYTHON_VERSION}"
          go install "github.com/scip-code/scip-go/cmd/scip-go@${SCIP_GO_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate scip_pb2 for P0's ingest
        run: |
          set -euo pipefail
          pip install "protobuf==${PROTOBUF_VERSION}" "grpcio-tools==${GRPCIO_TOOLS_VERSION}"
          mkdir -p "$RUNNER_TEMP/scippb"
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/scip-code/scip/${SCIP_PROTO_TAG}/scip.proto" \
            -o "$RUNNER_TEMP/scippb/scip.proto"
          python -m grpc_tools.protoc -I "$RUNNER_TEMP/scippb" \
            --python_out="$RUNNER_TEMP/scippb" "$RUNNER_TEMP/scippb/scip.proto"
      - name: Build, dump and rebuild each fixture
        env:
          LD_LIBRARY_PATH: ${{ env.LEIDEN_PREFIX }}/lib
        run: |
          set -uo pipefail
          mkdir -p churn/maps churn/graphs churn/variants churn/vmaps churn/pairs churn/merges churn/side clones
          python3 eval/scip_fixtures.py list > fixtures.txt
          while read -r name url sha pkg lang parcels; do
            echo "::group::$name"
            dir="clones/$name"
            git clone --quiet --filter=blob:none "$url" "$dir"
            git -C "$dir" checkout --quiet "$sha"
            parcels_arg=""
            [ "$parcels" = "true" ] || parcels_arg="--no-parcels"
            for mode in hand scip; do
              ./bin/tolmap build "$PWD/$dir" --pkg "$pkg" --lang "$lang" --refs "$mode" \
                $parcels_arg --name "$name" --out "churn/maps/$mode" \
                > "churn/maps/$name.$mode.log" 2>&1 || echo "$name build --refs $mode FAILED"
              # sqlalchemy's index is kept for P0's ingest below.
              keep=""
              [ "$name" = "sqlalchemy" ] && [ "$mode" = "scip" ] && keep="$PWD/churn/index/sqlalchemy"
              TOLMAP_SCIP_INDEX_DIR="$keep" ./bin/tolmap dump-graph "$PWD/$dir" --pkg "$pkg" --lang "$lang" \
                --refs "$mode" --out "churn/graphs/$name.$mode.graph.json" \
                || echo "$name dump-graph --refs $mode FAILED"
            done
            python3 eval/scip_churn.py variants --hand "churn/graphs/$name.hand.graph.json" \
              --scip "churn/graphs/$name.scip.graph.json" --out "churn/variants/$name" --seeds "$SEEDS" \
              || echo "$name variants FAILED"
            for mode in hand scip; do
              mkdir -p "churn/vmaps/$name/$mode-repo"
              cp "churn/maps/$mode/$name.json" "churn/vmaps/$name/$mode-repo/" || true
            done
            for graph in "churn/graphs/$name.hand.graph.json" "churn/graphs/$name.scip.graph.json" \
                churn/variants/"$name"/*.graph.json; do
              variant="$(basename "$graph" .graph.json)"
              case "$variant" in
                "$name.hand") variant=hand-graph ;;
                "$name.scip") variant=scip-graph ;;
              esac
              ./bin/tolmap build --graph "$graph" --name "$name" --no-parcels --refs hand \
                --out "churn/vmaps/$name/$variant" > /dev/null 2> "churn/vmaps/$name/$variant.err" \
                || { echo "$name $variant FAILED"; tail -5 "churn/vmaps/$name/$variant.err"; }
            done
            python3 eval/scip_churn.py pairs --hand "churn/graphs/$name.hand.graph.json" \
              --scip "churn/graphs/$name.scip.graph.json" --repo "$dir" --out "churn/pairs/$name.json" \
              || echo "$name pairs FAILED"
            python3 eval/scip_churn.py merges --hand "churn/graphs/$name.hand.graph.json" \
              --scip "churn/graphs/$name.scip.graph.json" --hand-map "churn/maps/hand/$name.json" \
              --scip-map "churn/maps/scip/$name.json" --out "churn/merges/$name.json" \
              || echo "$name merges FAILED"
            python3 eval/scip_churn.py side-by-side --hand-map "churn/maps/hand/$name.json" \
              --scip-map "churn/maps/scip/$name.json" --name "$name" --out "churn/side/$name.md" > /dev/null \
              || echo "$name side-by-side FAILED"
            # Variant graphs are rebuilt from the dumps by the script; the
            # artifact keeps the dumps, the summaries and the maps.
            rm -f churn/variants/"$name"/*.graph.json
            [ "$name" = "sqlalchemy" ] || rm -rf "$dir"
            echo "::endgroup::"
          done < fixtures.txt
      - name: sqlalchemy -- why scip-python keeps 0.66 of the hand pairs
        env:
          LD_LIBRARY_PATH: ${{ env.LEIDEN_PREFIX }}/lib
        run: |
          # Not -e: a missing file or a failed variant is a finding here,
          # not a reason to stop measuring the next one.
          set +e -uo pipefail
          dir="$PWD/clones/sqlalchemy"
          mkdir -p churn/sqla
          {
            echo "## configuration in the checkout"
            ls "$dir"/pyrightconfig.json 2>&1
            grep -n -A12 '^\[tool.pyright\]' "$dir/pyproject.toml" || echo "no [tool.pyright] in pyproject.toml"
            grep -n -A6 '^\[tool.setuptools' "$dir/pyproject.toml" || true
            echo "## Cython sources under lib/"
            find "$dir/lib" \( -name '*.pyx' -o -name '*.pxd' -o -name '*.pyi' \) | sed "s|$dir/||" | sort
            grep -rl "cython" "$dir/lib/sqlalchemy" --include='*.py' | sed "s|$dir/||" | sort | head -40
          } > churn/sqla/layout.txt 2>&1
          cat churn/sqla/layout.txt
          ingest() {  # $1 label, $2 index file
            PYTHONPATH="$RUNNER_TEMP/scippb:$PWD/eval" python3 eval/scip_ingest.py --index "$2" \
              --map churn/maps/hand/sqlalchemy.json --graph churn/graphs/sqlalchemy.hand.graph.json \
              --lang py --out "churn/sqla/ingest-$1.json" \
              && python3 eval/scip_churn.py missed --hand churn/graphs/sqlalchemy.hand.graph.json \
                --ingest "churn/sqla/ingest-$1.json" --repo "$dir" --out "churn/sqla/missed-$1.json" \
              || echo "ingest $1 FAILED"
          }
          ingest baseline churn/index/sqlalchemy/py.scip
          variant() {  # $1 label; environment and files set by the caller
            TOLMAP_SCIP_INDEX_DIR="$PWD/churn/index/$1" ./bin/tolmap dump-graph "$dir" \
              --pkg lib/sqlalchemy --lang py --refs scip --out "churn/sqla/$1.graph.json" \
              || echo "dump $1 FAILED"
            python3 -c "import json,sys; g=json.load(open(sys.argv[1])); print(sys.argv[2], json.dumps(g.get('references')))" \
              "churn/sqla/$1.graph.json" "$1" | tee -a churn/sqla/recall.txt
            ingest "$1" "churn/index/$1/py.scip"
          }
          # 1. The interpreter's search path: pyright asks `python` for
          #    sys.path, so PYTHONPATH reaches import resolution with no file
          #    written into the checkout.
          export PYTHONPATH="$dir/lib"
          variant pythonpath
          unset PYTHONPATH
          # 2. pyright's own extraPaths, from a config file at the root.
          if [ ! -e "$dir/pyrightconfig.json" ]; then
            echo '{"extraPaths": ["lib"]}' > "$dir/pyrightconfig.json"
            variant extrapaths
            rm -f "$dir/pyrightconfig.json"
          fi
          python3 - <<'EOF' | tee churn/sqla/summary.txt
          import json, pathlib
          for path in sorted(pathlib.Path("churn/sqla").glob("missed-*.json")):
              m = json.loads(path.read_text())
              print(path.stem, "recall", round(m["recall"], 4), "missed", m["missed"],
                    "by tag", m["missed_by_tag"], "kept by tag", m["kept_by_tag"])
          EOF
      - name: Score the rebuilds
        if: always()
        run: |
          set -euo pipefail
          python3 eval/scip_churn.py score --work churn/vmaps --variants churn/variants \
            --out churn/score.json --markdown churn/score.md
          cat churn/score.md >> "$GITHUB_STEP_SUMMARY"
          for name in flask httpx celery scrapy; do cat "churn/side/$name.md"; done > churn/side-by-side.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scip-churn
          path: |
            churn
            !churn/index
          retention-days: 30

  # Finding 48: how the hand-written resolver scores against SCIP (issue
  # #110; owner decision 2026-09-25T16:56:34Z, "Tune hand, SCIP as oracle":
  # hand stays the default and SCIP only measures it). For each fixture it
  # dumps the hand graph, runs the pinned indexer through `dump-graph --refs
  # scip` with the index kept, and scores hand's directed pairs against P0's
  # oracle ingest of that index (eval/hand_score.py's docstring has the
  # definitions and the pair classes). The oracle rather than the SCIP graph,
  # because sqlalchemy's index falls below the admission floor and its SCIP
  # graph is hand's; where a language is admitted the two are checked equal.
  # The gate compares with the committed data/scip/hand_score.json and fails
  # only on a regression: the oracle moving, an over-attribution class rising,
  # or confirmed pairs falling (`gate`'s docstring says why only those).
  hand-score:
    name: Hand resolver vs SCIP score (on demand / nightly)
    needs: gate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # About the scip-fixtures job's indexing time plus the ingest; bounded so
    # a hung indexer cannot hold the runner.
    timeout-minutes: 90
    env:
      SCIP_TYPESCRIPT_VERSION: "0.4.0"
      SCIP_PYTHON_VERSION: "0.6.6"
      SCIP_GO_VERSION: "v0.2.7"
      SCIP_PROTO_TAG: "v0.10.0"
      PROTOBUF_VERSION: "5.29.3"
      GRPCIO_TOOLS_VERSION: "1.70.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-tolmap-binary
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: ci-leiden-lib
          path: ${{ env.LEIDEN_PREFIX }}/lib
      - run: chmod +x bin/tolmap
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install pinned indexers
        run: |
          set -euo pipefail
          npm install -g "@sourcegraph/scip-typescript@${SCIP_TYPESCRIPT_VERSION}" \
            "@sourcegraph/scip-python@${SCIP_PYTHON_VERSION}"
          go install "github.com/scip-code/scip-go/cmd/scip-go@${SCIP_GO_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate scip_pb2 for P0's ingest
        run: |
          set -euo pipefail
          pip install "protobuf==${PROTOBUF_VERSION}" "grpcio-tools==${GRPCIO_TOOLS_VERSION}"
          mkdir -p "$RUNNER_TEMP/scippb"
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/scip-code/scip/${SCIP_PROTO_TAG}/scip.proto" \
            -o "$RUNNER_TEMP/scippb/scip.proto"
          python -m grpc_tools.protoc -I "$RUNNER_TEMP/scippb" \
            --python_out="$RUNNER_TEMP/scippb" "$RUNNER_TEMP/scippb/scip.proto"
      - name: Oracle ingest self-test
        run: PYTHONPATH="$RUNNER_TEMP/scippb:$PWD/eval" python3 eval/scip_ingest.py --self-test
      - name: Score each fixture
        env:
          LD_LIBRARY_PATH: ${{ env.LEIDEN_PREFIX }}/lib
        run: |
          # Not -e: a fixture that fails to build is reported by `summary`
          # (which then fails the step), not a reason to skip the other eight.
          set -uo pipefail
          scip-typescript --version; scip-python --version; command -v scip-go
          mkdir -p score clones
          python3 eval/scip_fixtures.py list > fixtures.txt
          while read -r name url sha pkg lang parcels; do
            echo "::group::$name"
            dir="clones/$name"
            work="score/$name"
            mkdir -p "$work/index"
            # Blobless, full history: the same clone `full-fixtures` builds.
            git clone --quiet --filter=blob:none "$url" "$dir"
            git -C "$dir" checkout --quiet "$sha"
            parcels_arg=""
            [ "$parcels" = "true" ] || parcels_arg="--no-parcels"
            # Names seeded from the committed fixture, as remote-build.yml's
            # fixture band does, so this map is also a fixture re-derivation
            # when an extraction change moves one (CLAUDE.md, "Checks before
            # a change lands"). It has to be this job's map, on a full-history
            # clone like `full-fixtures`: remote-build's depth-4000 clone
            # gives django a different co-change graph, placing 75.2% against
            # its own committed fixture with an unchanged binary (finding 49).
            PYTHONPATH="$PWD/src" python3 eval/seed_names.py "$work/map" "$name" > /dev/null
            ./bin/tolmap build "$PWD/$dir" --pkg "$pkg" --lang "$lang" --refs hand $parcels_arg \
              --name "$name" --out "$work/map" > "$work/build.log" 2>&1 || echo "$name build FAILED"
            # TOLMAP_GO_IMPORT_REPORT: the Go resolver's own per-import report
            # (narrowed, or why it kept the whole package; finding 50).
            # TOLMAP_TS_IMPORT_REPORT: the TypeScript resolver's, per module
            # specifier (where it resolved, and what following its names
            # through re-exports reached; finding 51).
            # TOLMAP_PY_IMPORT_REPORT: the Python resolver's, per statement
            # (the files it linked before module objects and module
            # re-exports were followed, and now; finding 53).
            TOLMAP_PY_IMPORT_REPORT="$PWD/$work" \
            TOLMAP_GO_IMPORT_REPORT="$PWD/$work" TOLMAP_TS_IMPORT_REPORT="$PWD/$work" \
              ./bin/tolmap dump-graph "$PWD/$dir" --pkg "$pkg" \
              --lang "$lang" --refs hand \
              --out "$work/hand.graph.json" || echo "$name dump-graph --refs hand FAILED"
            # Finding 51: the TypeScript static signal rebuilt from the
            # resolver's report, as the resolver weighs it (`share`, a
            # construction check) and with 1 on each file an import reaches
            # (`per-file`), each partitioned by the product.
            if [ "$lang" = "ts" ]; then
              python3 eval/hand_score.py ts-variants --work "$work" || echo "$name ts-variants FAILED"
              for variant in share per-file; do
                [ -f "$work/variants/$variant.graph.json" ] || continue
                ./bin/tolmap build --graph "$work/variants/$variant.graph.json" --name "$name.$variant" \
                  --no-parcels --refs hand --out "$work/variants/maps" > "$work/variants/$variant.log" 2>&1 \
                  || echo "$name $variant build FAILED"
              done
            fi
            TOLMAP_SCIP_INDEX_DIR="$PWD/$work/index" ./bin/tolmap dump-graph "$PWD/$dir" --pkg "$pkg" \
              --lang "$lang" --refs scip --out "$work/scip.graph.json" \
              || echo "$name dump-graph --refs scip FAILED"
            for index in "$work"/index/*.scip; do
              [ -e "$index" ] || continue
              language="$(basename "$index" .scip)"
              PYTHONPATH="$RUNNER_TEMP/scippb:$PWD/eval" python3 eval/scip_ingest.py --index "$index" \
                --map "$work/map/$name.json" --graph "$work/hand.graph.json" --lang "$language" \
                --out "$work/$language.ingest.json" || echo "$name ingest $language FAILED"
            done
            python3 eval/hand_score.py score --name "$name" --work "$work" --repo "$dir" \
              --out "$work/score.json" || echo "$name score FAILED"
            rm -rf "$dir" "$work/index" "$work"/map/*.symbols.json "$work"/variants/maps/*.symbols.json
            echo "::endgroup::"
          done < fixtures.txt
      # Issue #126 (finding 56): Rust's oracle. The product has no Rust
      # indexer: rust-analyzer's `scip` compiles a repository's build scripts
      # and proc-macro crates natively and has no flag to stop it, and
      # offline it silently degrades to `--no-deps` (finding 55). So it runs
      # here, network mode, at finding 55's pinned release, on the repos
      # `hand_score.py rust-targets` lists (tolmap, a map fixture, and
      # ripgrep 14.1.1, scored only). Each is a fresh CARGO_HOME, with
      # LEIDEN_PREFIX unset as in finding 55's runs. Rust rows are reported,
      # never gated, until the owner has seen the numbers.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install rust-analyzer (pinned, verified)
        env:
          RUST_ANALYZER_TAG: "2026-09-21"
          RUST_ANALYZER_SHA256: "b2d24ce2bda2ea05b1ad7c2917d205f8111775f703ccd908e6061803ae8257d0"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o ra.gz \
            "https://github.com/rust-lang/rust-analyzer/releases/download/${RUST_ANALYZER_TAG}/rust-analyzer-x86_64-unknown-linux-gnu.gz"
          echo "${RUST_ANALYZER_SHA256}  ra.gz" | sha256sum -c -
          gunzip ra.gz
          chmod +x ra
          sudo mv ra /usr/local/bin/rust-analyzer
          rust-analyzer --version
          command -v /usr/bin/time || { sudo apt-get update && sudo apt-get install -y time; }
      - name: Score Rust against rust-analyzer (reported, not gated)
        env:
          LD_LIBRARY_PATH: ${{ env.LEIDEN_PREFIX }}/lib
        run: |
          # Not -e: a repo that fails is reported by `summary`, not a reason
          # to skip the other.
          set -uo pipefail
          mkdir -p score clones
          python3 eval/hand_score.py rust-targets > rust-targets.txt
          cat rust-targets.txt
          while read -r name url sha pkg; do
            echo "::group::$name (rs)"
            dir="clones/$name"
            work="score/$name"
            mkdir -p "$work/index"
            git clone --quiet --filter=blob:none "$url" "$dir"
            git -C "$dir" checkout --quiet "$sha"
            # As the main loop: names seeded from a committed fixture, on a
            # full-history clone, so this map is also the fixture's
            # re-derivation.
            if [ -f "data/$name.json" ]; then
              PYTHONPATH="$PWD/src" python3 eval/seed_names.py "$work/map" "$name" > /dev/null
            fi
            parcels_arg="--no-parcels"
            ./bin/tolmap build "$PWD/$dir" --pkg "$pkg" --lang rs --refs hand $parcels_arg \
              --name "$name" --out "$work/map" > "$work/build.log" 2>&1 || echo "$name build FAILED"
            TOLMAP_RUST_IMPORT_REPORT="$PWD/$work" ./bin/tolmap dump-graph "$PWD/$dir" --pkg "$pkg" \
              --lang rs --refs hand --out "$work/hand.graph.json" || echo "$name dump-graph --refs hand FAILED"
            # The viewer's Rust map (web/check-fixtures): the same build with
            # file footprints, which the fixture itself does not record.
            # Its names come from the map just built, whose membership it
            # shares: footprints do not move the partition.
            if [ "$name" = "tolmap" ]; then
              mkdir -p "$work/viewer"
              cp "$work/map/$name.names.json" "$work/viewer/" 2>/dev/null || true
              ./bin/tolmap build "$PWD/$dir" --pkg "$pkg" --lang rs --refs hand \
                --name "$name" --out "$work/viewer" > "$work/viewer.log" 2>&1 || echo "$name viewer build FAILED"
            fi
            # Last: rust-analyzer runs cargo in the clone and may leave
            # target/ behind (never mapped).
            env -u LEIDEN_PREFIX CARGO_HOME="$RUNNER_TEMP/cargo-home-$name" \
              /usr/bin/time -v -o "$work/rust-analyzer.time.txt" \
              rust-analyzer scip "$PWD/$dir" --output "$PWD/$work/index/rs.scip" --exclude-vendored-libraries \
              > "$work/rust-analyzer.log" 2>&1 || echo "$name rust-analyzer FAILED"
            tail -5 "$work/rust-analyzer.log"
            grep -E "Elapsed|Maximum resident" "$work/rust-analyzer.time.txt" || true
            if [ -s "$work/index/rs.scip" ]; then
              PYTHONPATH="$RUNNER_TEMP/scippb:$PWD/eval" python3 eval/scip_ingest.py --index "$work/index/rs.scip" \
                --map "$work/map/$name.json" --graph "$work/hand.graph.json" --lang rs \
                --out "$work/rs.ingest.json" || echo "$name ingest rs FAILED"
            fi
            python3 eval/hand_score.py score --name "$name" --work "$work" --repo "$dir" \
              --out "$work/score.json" || echo "$name score FAILED"
            rm -rf "$dir" "$work/index"
            echo "::endgroup::"
          done < rust-targets.txt
      - name: Summary
        run: |
          set -uo pipefail
          python3 eval/hand_score.py summary --work score --out score/hand_score.json \
            --markdown score/hand_score.md
          status=$?
          cat score/hand_score.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Record a fresh baseline (artifact only)
        if: always()
        run: |
          python3 eval/hand_score.py baseline --summary score/hand_score.json --out score/baseline.json \
            --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hand-score
          path: score
          retention-days: 30
      - name: Gate against data/scip/hand_score.json
        if: always()
        run: python3 eval/hand_score.py gate --summary score/hand_score.json --baseline data/scip/hand_score.json

  web:
    # The viewer had no CI at all: tsc ran only inside the Docker image at
    # deploy time. The redesign (#82) rewrites most of MapRenderer.ts, so type
    # errors and lint regressions must fail the push, not the deploy. This
    # runs the same `pnpm build` the Dockerfile's web-builder stage runs
    # (collect-maps falls back to the committed data/ fixtures), plus oxlint.
    name: web build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      # Same pin as the Dockerfile: the lockfile is pnpm 9's format.
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: node scripts/check-collect-symbols.mjs
      # Issue #110 P2: map/referenceCoverage.ts's pure summarising function
      # (the "exact (SCIP) vs heuristic" indicator's collapsed-label and
      # per-language logic), the same npx-tsx pattern check-pinch-math.ts and
      # check-district-colours.ts already use in this project (no test
      # runner exists yet -- web/README.md) but the first of the three
      # actually wired into a workflow, since this one runs from scripted
      # data rather than a Playwright session or a public/maps/ fixture.
      - run: npx --yes tsx@4.23.15 scripts/check-reference-coverage.ts
      - run: pnpm build

  full-fixtures:
    name: full nine-fixture parity (on demand / nightly)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache native Leiden/igraph build
        id: cache-leiden
        uses: actions/cache@v4
        with:
          path: ${{ env.LEIDEN_PREFIX }}
          key: leiden-${{ runner.os }}-${{ hashFiles('scripts/install-leiden.sh') }}

      - name: Build native Leiden/igraph
        if: steps.cache-leiden.outputs.cache-hit != 'true'
        run: bash scripts/install-leiden.sh "${{ env.LEIDEN_PREFIX }}"

      - name: cargo build
        run: cargo build --release --bin tolmap

      - name: Full nine-fixture parity
        run: |
          set -uo pipefail
          # name pkg lang url commit -- commits pinned at the SHA each
          # fixture happened to be at when this workflow was authored
          # (2026-09-19). Not verified to be the exact commit `data/*.json`
          # was itself measured against (that commit is not recorded
          # anywhere in this repo) -- if a fixture's numbers drift from
          # data/*.json, check that before assuming a regression.
          fixtures="
          flask      src/flask      py https://github.com/pallets/flask.git      d73fa1cdcbd8b1465c151db8924ba58b1dd14e35
          httpx      httpx          py https://github.com/encode/httpx.git       b5addb64f0161ff6bfe94c124ef76f6a1fba5254
          rich       rich           py https://github.com/Textualize/rich.git    9d8f9a372cc5916fd4781fec207ced7ddac2f08f
          celery     celery         py https://github.com/celery/celery.git     208a803655672d63cf2a257d30f39c672a5b4bcf
          scrapy     scrapy         py https://github.com/scrapy/scrapy.git      fe30c1882a12651c19c5a94d71e9f14e442456c7
          sqlalchemy lib/sqlalchemy py https://github.com/sqlalchemy/sqlalchemy.git 4883307858ea3def775b5a1cc1c01a5be6dfe213
          django     django         py https://github.com/django/django.git     a3f0642f69277f01611d0d3e829fc3b85aded2ec
          vue        packages       ts https://github.com/vuejs/core.git        4ab865a848a1da3d10fb674f857e5fff13094644
          prometheus .              go https://github.com/prometheus/prometheus.git 296080c0a504ea0e72941ef16143f0a9702b137b
          "
          mkdir -p full-clones full-out
          failed=""
          while read -r name pkg lang url sha; do
            [ -z "$name" ] && continue
            echo "::group::$name"
            dir="full-clones/$name"
            # Blobless clone: co-change needs full commit history (git log
            # over every commit, not just the tip), so a depth-1 clone is
            # not enough -- docs/ARCHITECTURE.md's documented clone strategy.
            git clone --quiet --filter=blob:none "$url" "$dir"
            git -C "$dir" checkout --quiet "$sha"
            # --refs hand: data/*.json is the hand path's output -- the
            # Rust product's for all nine since finding 53 re-derived
            # httpx, the last frozen-Python-reference fixture
            # (data/fixtures.toml's `generator`) -- and it knows no SCIP. The SCIP path is
            # gated against its own fixtures in `scip-fixtures` below.
            ./target/release/tolmap build "$dir" --pkg "$pkg" --lang "$lang" \
              --refs hand --name "$name" --out full-out --resolution 1.1
            if ! ./target/release/tolmap parity "data/${name}.json" "full-out/${name}.json"; then
              failed="$failed $name"
            fi
            echo "::endgroup::"
          done <<< "$fixtures"
          failed="$(echo "$failed" | xargs)"  # trim
          echo "failed fixtures:${failed:+ $failed}${failed:-" (none)"}"
          # See the workflow-level comment: sqlalchemy failing alone, on its
          # landmark list only, is the one open, measured gap
          # (docs/FINDINGS.md finding 11) -- not a regression signal by
          # itself. Anything else failing, or sqlalchemy failing alongside
          # another fixture, is a real regression and must not be silently
          # absorbed into "expected". Still exits non-zero even on the
          # expected case: this job's whole purpose is to stay a visible red
          # record of the gap until it's actually closed, not to report green
          # over it.
          if [ "$failed" = "sqlalchemy" ]; then
            echo "only the known gap (sqlalchemy) failed -- see docs/FINDINGS.md finding 11"
            exit 1
          elif [ -z "$failed" ]; then
            echo "all nine fixtures passed -- if sqlalchemy's gap has been closed, update the workflow comment and this check"
          else
            echo "UNEXPECTED failure(s), beyond the known sqlalchemy gap: $failed"
            exit 1
          fi
