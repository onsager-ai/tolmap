name: Reader diagnostic
on:
  workflow_dispatch:
  push:
    branches: [feat/snapshot-reader]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@v4
        with:
          name: ci-tolmap-binary
          run-id: 39149998237
          github-token: ${{ github.token }}
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: ci-leiden-lib
          run-id: 39149998237
          github-token: ${{ github.token }}
          path: .native/lib
      - run: chmod +x bin/tolmap
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec vite build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: python3 scripts/local-reader-fixture.py
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.native/lib
      - run: cd web && node scripts/check-source-reader.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-diagnostic
          path: reader-evidence/
