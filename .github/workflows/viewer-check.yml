# Browser checks for the viewer, on GitHub's runners.
#
# Why here and not locally: headless Chromium renders in software, and on
# 2026-09-23 a single check:view run drove the maintainer's laptop to
# 95-99 °C (its cooling is broken; it has powered off under load twice).
# CLAUDE.md's viewer check -- districts named, landmarks listed, tapping a
# district, a file and a symbol each produce a card, on a phone and a
# desktop -- is exercised by check-view-stability.mjs, so it runs here, and
# screenshots are uploaded for review instead of taken on the laptop.
name: Viewer check

on:
  pull_request:
    paths:
      - "web/**"
      - "bindings/**"
      - ".github/workflows/viewer-check.yml"
  workflow_dispatch:

jobs:
  view:
    name: check:view + screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      # collect-maps writes the committed data/ fixtures into public/maps;
      # the two maps check:view pins by hash are then unpacked over it.
      # Issue #82 C2: the per-district symbol fixtures (trimmed -- see
      # check-fixtures/README.md) unpack into public/maps/<owner>/
      # <repo>.symbols/<district>.json, the same static layout docs/API.md
      # describes for a real `tolmap build`.
      - name: Maps
        run: |
          node scripts/collect-maps.mjs
          for f in check-fixtures/*.json.gz; do
            slug=$(basename "$f" .json.gz)
            mkdir -p "public/maps/${slug%%__*}"
            gunzip -c "$f" > "public/maps/${slug%%__*}/${slug##*__}.json"
          done
          for f in check-fixtures/*.symbols.tar.gz; do
            slug=$(basename "$f" .symbols.tar.gz)
            mkdir -p "public/maps/${slug%%__*}"
            tar -xzf "$f" -C "public/maps/${slug%%__*}"
          done
      # Issue #97: the job-page checks below need a running job service --
      # there is no Rust `tolmap serve` in this job, so scripts/mock-api-
      # server.mjs stands in for it (docs/API.md's contract, scripted
      # stages/progress/eta/cancel; see that file's own header comment).
      # Started before Vite so TOLMAP_API_PROXY_TARGET points the dev
      # server's /api proxy (vite.config.ts) at it from the first request.
      - name: Start mock API server
        run: |
          nohup node scripts/mock-api-server.mjs 8787 > mock-api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/api/healthz >/dev/null && exit 0; sleep 1; done
          cat mock-api.log; exit 1
      # --host 127.0.0.1: Vite binds "localhost", which resolves to ::1 on
      # the runner, so a probe of 127.0.0.1 never connects.
      - name: Start Vite
        env:
          TOLMAP_API_PROXY_TARGET: "http://127.0.0.1:8787"
        run: |
          nohup pnpm exec vite --host 127.0.0.1 --port 5176 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5176/ >/dev/null && exit 0; sleep 1; done
          cat vite.log; exit 1
      - name: check:view
        run: node scripts/check-view-stability.mjs --base http://127.0.0.1:5176
      - name: Screenshots
        if: always()
        run: node scripts/screenshots.mjs --base http://127.0.0.1:5176 --out shots
      # Issue #126: a Rust map (tolmap itself, data/tolmap.json, and its
      # symbols from web/check-fixtures) renders on a phone and a desktop,
      # overview to symbols, with the language named.
      - name: Screenshots (Rust map)
        if: always()
        run: |
          if [ -f public/maps/onsager-ai/tolmap.json ]; then
            node scripts/screenshots.mjs --base http://127.0.0.1:5176 --slugs onsager-ai/tolmap --out shots/rust
          else
            echo "no Rust map in public/maps"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-shots
          path: web/shots/
          if-no-files-found: warn
      # B4 perf follow-up (issue #82, owner review): dify is the one fixture
      # large enough (6,347 files) for paint cost to be worth measuring in
      # CI -- perf-bench.mjs is Playwright-based, so this is the only place
      # it can run (see CLAUDE.md's no-browser-locally rule). Runs BOTH the
      # footprint-mode map and a dots-only baseline (check-fixtures/README.md:
      # the same map with P/footprint_centroids/file_neighbourhoods/
      # neighbourhoods stripped, so the SAME code takes the old dot path) in
      # one invocation so both land in the same output table. dify's file
      # count clears perf-bench's own big-map threshold (5000) and drops to
      # one run with a capped gesture budget; dify-baseline isn't in
      # collect-maps.mjs's index.json (it's a synthetic slug, not a real
      # catalogue entry), so perf-bench treats it as small and runs it the
      # full 3x/40-step way instead -- an asymmetry in SAMPLE SIZE, not in
      # what's being measured (the same tolmap:draw performance-mark
      # duration either way), and both are reported plainly regardless.
      - name: Perf bench (dify, footprints vs dots baseline)
        if: always()
        run: node scripts/perf-bench.mjs --base http://127.0.0.1:5176 --maps langgenius/dify,dify-baseline/dify --runs 3 --out perf/dify.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-bench
          path: web/perf/
          if-no-files-found: warn
