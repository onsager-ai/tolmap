name: Storybook visual candidates
on:
  pull_request:
    paths: ['web/**', 'web/storybook/baselines/**', 'bindings/**', 'src/local_pages.rs', 'web/scripts/export-local-storybook.rs', 'docs/STORYBOOK.md', '.github/workflows/storybook.yml']
  workflow_dispatch:
concurrency:
  group: storybook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Native template formatting
        run: rustfmt --edition 2021 --check ../src/local_pages.rs scripts/export-local-storybook.rs
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.storybook.json
      - run: pnpm build-storybook
        env:
          # The preview must ignore a developer's production API override.
          VITE_API_BASE: https://storybook-api.invalid
      - run: pnpm exec playwright install --with-deps chromium
      - name: Storybook coverage and visual-baseline selftests
        run: pnpm test:storybook-coverage
      - name: Start static workbench
        run: |
          python3 -m http.server 6007 --bind 127.0.0.1 --directory storybook-static > /tmp/tolmap-storybook.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:6007/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/tolmap-storybook.log; exit 1
      - run: pnpm check:storybook
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tolmap-storybook
          path: web/storybook-static/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tolmap-visual-candidates
          path: web/storybook-evidence/
      - name: Upload focused reader review images
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tolmap-reader-review-samples
          path: |
            web/storybook-evidence/manifest.json
            web/storybook-evidence/oss-source-ready-*.png
            web/storybook-evidence/oss-source-search-*.png
            web/storybook-evidence/oss-source-long-line-*.png
            web/storybook-evidence/oss-map-file-*.png
          if-no-files-found: error
