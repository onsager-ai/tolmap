name: Reader dependency preparation
on:
  pull_request:
    paths: ['web/package.json', '.github/workflows/reader-prepare.yml']
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - run: pnpm --dir web install --lockfile-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: reader-lockfile
          path: web/pnpm-lock.yaml
