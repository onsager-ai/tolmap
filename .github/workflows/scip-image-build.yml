# Builds the worker Dockerfile and smoke-tests the SCIP indexers inside it
# (issue #110 P1b). CLAUDE.md: the maintainer's laptop cannot run `docker
# build`, cargo, indexers or browsers -- its cooling is broken -- so this is
# the only place this Dockerfile gets built or run before a real deploy.
# The production deploy workflow doesn't help here: it lives in the
# private hosting repo (`tolmap-infra`), builds on Fly's own remote
# builder rather than a GitHub-hosted runner, and only runs on a manual
# dispatch naming a release.
#
# Two full image builds, not one: `after` is this ref's Dockerfile (with the
# `scip-tools` stage), `before` is main's (without it), built from a
# separate worktree of the same checkout. Comparing them is the only way to
# get real before/after image-size and build-time numbers for the PR body
# rather than guessing at what the new stage costs -- hosting spend is the
# owner's call (see the private hosting repo's docs/SIZING.md), but the
# owner needs real numbers to make it.
# `scip-tools` is also timed in isolation, `--no-cache`, so its own cost
# isn't hidden inside the Rust/web build's much larger and more variable
# wall time.
#
# Dispatch with `--ref <branch>` while this file lives only on a feature
# branch (GitHub only dispatches a workflow file that's on the default
# branch otherwise); it also runs automatically on a pull request that
# touches the Dockerfile or these fixtures.

name: SCIP worker image build (#110 P1b)

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "tests/fixtures/scip/**"
      - "tests/fixtures/sandbox/**"
      - "src/indexers.rs"
      # The end-to-end service test below guards the worker protocol and
      # the job directory the service hands its worker (issue #141).
      - "src/worker.rs"
      - "src/service/jobs.rs"
      - "src/service/executor.rs"
      - "src/service/worker_result.rs"
      # #97 phase 1: the loopback step below runs the same job through a
      # worker agent over the channel.
      - "src/service/workers.rs"
      - "src/service/agent.rs"
      - ".github/workflows/scip-image-build.yml"
  workflow_dispatch:
    inputs:
      compare_main:
        description: "Also build main's Dockerfile for a before/after size and time comparison"
        type: boolean
        default: true

jobs:
  build-and-smoke:
    name: build image, measure size, smoke-test indexers
    runs-on: ubuntu-latest
    # Two full multi-stage builds (native + rust release + web bundle, twice)
    # on a cold runner with no layer cache: generous on purpose, not a
    # measured budget.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker version
        run: docker version

      # Two full multi-stage builds (Rust release, web bundle, Leiden C++,
      # now also Go/Node/npm toolchains) on the same runner: the standard
      # runner image ships ~9 GB of preinstalled tooling this workflow never
      # touches (Android SDK, .NET, GHC, a second copy of Docker images) --
      # freed up front rather than found out about mid-build.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker image prune -af || true
          df -h /

      # Timed and built --no-cache, in isolation, so its cost is not folded
      # into (or hidden by cache reuse from) the full image build below.
      - name: Build scip-tools stage alone (timed, no cache)
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker build --no-cache --target scip-tools -t scip-tools-only .
          end=$(date +%s)
          secs=$((end - start))
          echo "SCIP_TOOLS_BUILD_SECONDS=$secs" >> "$GITHUB_ENV"
          echo "scip-tools stage: ${secs}s"
          # Drop the tag, not the underlying layers: BuildKit's content-
          # addressed cache still lets the full build below reuse this
          # stage's layers even though this build ran with --no-cache
          # itself. Runner disk is finite across two full image builds.
          docker rmi scip-tools-only

      - name: Build the full image (this ref, after)
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker build -t tolmap:after .
          end=$(date +%s)
          secs=$((end - start))
          echo "AFTER_BUILD_SECONDS=$secs" >> "$GITHUB_ENV"
          size=$(docker image inspect tolmap:after --format='{{.Size}}')
          echo "AFTER_SIZE_BYTES=$size" >> "$GITHUB_ENV"
          echo "after: ${secs}s, $((size / 1024 / 1024)) MB"

      - name: Build main's image for comparison (before)
        if: github.event_name == 'pull_request' || inputs.compare_main
        run: |
          set -euo pipefail
          # actions/checkout's remote is scoped to the ref it checked out,
          # so `origin/main` is not necessarily a resolvable remote-tracking
          # branch here -- fetch main straight into FETCH_HEAD instead of
          # relying on one.
          git fetch origin main --depth=1
          git worktree add --detach /tmp/main-checkout FETCH_HEAD
          start=$(date +%s)
          docker build -t tolmap:before /tmp/main-checkout
          end=$(date +%s)
          secs=$((end - start))
          echo "BEFORE_BUILD_SECONDS=$secs" >> "$GITHUB_ENV"
          size=$(docker image inspect tolmap:before --format='{{.Size}}')
          echo "BEFORE_SIZE_BYTES=$size" >> "$GITHUB_ENV"
          echo "before: ${secs}s, $((size / 1024 / 1024)) MB"
          # Only its size was needed; free the disk before the smoke steps
          # below build and run more against tolmap:after.
          docker rmi tolmap:before
          git worktree remove --force /tmp/main-checkout

      - name: Indexer and runtime versions
        run: |
          set -euo pipefail
          echo "--- scip-typescript ---"
          docker run --rm --entrypoint scip-typescript tolmap:after --version
          echo "--- scip-python ---"
          docker run --rm --entrypoint scip-python tolmap:after --version
          echo "--- scip-go ---"
          docker run --rm --entrypoint scip-go tolmap:after --version
          echo "--- node (scip-typescript/scip-python runtime) ---"
          docker run --rm --entrypoint node tolmap:after --version
          echo "--- go (scip-go runtime, not just its own build) ---"
          docker run --rm --entrypoint /opt/go/bin/go tolmap:after version
          echo "--- python3 (scip-python/Pyright's environment discovery) ---"
          docker run --rm --entrypoint python3 tolmap:after --version

      # Each indexer runs against tests/fixtures/scip/<lang>, a tiny
      # dependency-free source sample (not a data/ci graph -- those are
      # pre-extracted graphs, not source). A bind mount, not files baked
      # into the image: the fixtures are test inputs, not image contents.
      - name: Index tiny fixtures inside the built image
        run: |
          set -euo pipefail
          mkdir -p smoke/go smoke/ts smoke/py
          cp -r tests/fixtures/scip/go/. smoke/go/
          cp -r tests/fixtures/scip/ts/. smoke/ts/
          cp -r tests/fixtures/scip/py/. smoke/py/

          echo "--- scip-go ---"
          docker run --rm -v "$PWD/smoke/go:/work" -w /work \
            --entrypoint scip-go tolmap:after --quiet --output /work/index.scip
          test -s smoke/go/index.scip

          echo "--- scip-typescript ---"
          docker run --rm -v "$PWD/smoke/ts:/work" -w /work \
            --entrypoint scip-typescript tolmap:after index --no-progress-bar --output /work/index.scip .
          test -s smoke/ts/index.scip

          echo "--- scip-python ---"
          # --project-version explicit: scip-python's own default is
          # `git rev-parse HEAD`, which (a) needs the fixture to be a git
          # repo at all and (b) trips git's "dubious ownership" guard when
          # a root-owned container process reads a bind-mounted directory
          # owned by the runner's non-root user -- and scip-python's error
          # handling for either failure is an unhandled TypeError, not a
          # clean message. Passing the flag sidesteps both, and the ingest
          # side (P1a) will pass a real value from the indexed commit
          # anyway, not rely on this default.
          docker run --rm -v "$PWD/smoke/py:/work" -w /work \
            --entrypoint scip-python tolmap:after index --project-name smoke \
            --project-version smoke-0.0.0 --quiet --output /work/index.scip
          test -s smoke/py/index.scip

          ls -la smoke/*/index.scip

      - name: Also smoke-test the product binary still starts
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /app/tolmap tolmap:after --help
          docker run --rm --entrypoint ldd tolmap:after /app/tolmap | (grep "not found" && exit 1 || true)

      # Issue #110 P1c: the dependency-install sandbox inside the built
      # image. `--privileged` stands in for the production host, a VM where
      # the service is root with every capability; a default container
      # (no CAP_SYS_ADMIN, Docker's seccomp profile) stands in for a host
      # that forbids namespaces, where installs must fall back. Neither is
      # the production host itself: its cgroup v1 memory controller is not
      # exercised here (TOLMAP_INSTALL_MEMORY_MAX stays off by default).
      - name: "Install sandbox: nsjail, socat and pnpm are in the image"
        run: |
          set -euo pipefail
          docker run --rm --entrypoint ldd tolmap:after /usr/local/bin/nsjail | (grep "not found" && exit 1 || true)
          docker run --rm --entrypoint sh tolmap:after -c \
            'command -v nsjail socat && /opt/node/bin/pnpm --version && echo "TOLMAP_NSJAIL=$TOLMAP_NSJAIL TOLMAP_INSTALL_NODE_PREFIX=$TOLMAP_INSTALL_NODE_PREFIX"'

      - name: "Install sandbox: the jail starts and reaches registry.npmjs.org and nothing else"
        run: |
          set -euo pipefail
          mkdir -p sandbox/egress
          cp tests/fixtures/sandbox/egress_check.js sandbox/egress/
          docker run --rm --privileged -v "$PWD/sandbox/egress:/srv/egress" \
            --entrypoint /app/tolmap tolmap:after \
            sandbox-exec --repo /srv/egress -- node egress_check.js

      - name: "Install sandbox: a sandboxed install admits the TypeScript workspace, as root VM and as a restricted container"
        run: |
          set -euo pipefail
          fixture() {
            rm -rf "$1"; mkdir -p "$(dirname "$1")"
            cp -r tests/fixtures/scip/ts-workspace "$1"
            git -C "$1" init --quiet && git -C "$1" add -A
            git -C "$1" -c user.name=ci -c user.email=ci@example.invalid commit --quiet -m fixture
          }
          # The image's worker uid owns the checkout, as it does in a job.
          # safe.directory: the CLI's own git calls run as root on it.
          build() {
            docker run --rm "$@" --entrypoint sh tolmap:after -c '
              git config --global --add safe.directory "*"
              chown -R 10001:10001 /srv/ws
              /app/tolmap build /srv/ws --pkg . --lang ts --refs scip --install sandbox \
                --name ts_workspace --out /srv/out'
          }
          fixture sandbox/ws-vm; mkdir -p sandbox/out-vm
          build --privileged -v "$PWD/sandbox/ws-vm:/srv/ws" -v "$PWD/sandbox/out-vm:/srv/out" \
            2>&1 | tee sandbox/vm.log | grep -E '^references |install|egress|sandbox' || true
          python3 eval/check_scip_references.py sandbox/out-vm/ts_workspace.json \
            --expect ts=scip --expect-install ts=installed
          test -f sandbox/ws-vm/packages/core/node_modules/tiny-invariant/package.json
          test "$(stat -c %u sandbox/ws-vm/packages/core/node_modules)" = 10001

          fixture sandbox/ws-restricted; mkdir -p sandbox/out-restricted
          build -v "$PWD/sandbox/ws-restricted:/srv/ws" -v "$PWD/sandbox/out-restricted:/srv/out" \
            2>&1 | tee sandbox/restricted.log | grep -E '^references |install|egress|sandbox' || true
          python3 eval/check_scip_references.py sandbox/out-restricted/ts_workspace.json \
            --expect ts=hand --expect-install ts=fell_back:sandbox_unavailable
          if find sandbox/ws-restricted -name node_modules -print -quit | grep -q .; then
            echo "the restricted-container fallback left node_modules behind"; exit 1
          fi

      # The job service end to end: `tolmap serve` as root with TOLMAP_REFS=
      # scip, its worker dropped to uid 10001, the worker asking the service
      # for the install over the worker protocol, the service running it in
      # nsjail. A local-path job (POST /api/index {"path"}) on the same
      # fixture.
      #
      # Then a second commit of the same fixture and a second job (issue
      # #141): the service's map store is root's and `0700`, the worker is
      # uid 10001, and finding 4's warm start (88% district retention warm,
      # 46% cold) reads the previous commit's map. The worker logs which
      # start it made and how many cached names it had in hand; the service
      # copies those lines into its own log, and this step asserts on them.
      - name: "Install sandbox: a SCIP job through the service installs via its worker's request, and a second commit warm-starts"
        run: |
          set -euo pipefail
          rm -rf sandbox/service-fixture
          cp -r tests/fixtures/scip/ts-workspace sandbox/service-fixture
          git -C sandbox/service-fixture init --quiet && git -C sandbox/service-fixture add -A
          git -C sandbox/service-fixture -c user.name=ci -c user.email=ci@example.invalid commit --quiet -m fixture
          docker run -d --name tolmap-service --privileged -p 127.0.0.1:8787:8787 \
            -e TOLMAP_REFS=scip -e TOLMAP_SCIP_INSTALL=sandbox -e TOLMAP_BIND_ADDR=0.0.0.0 -e TOLMAP_CACHE_DIR=/srv/cache \
            -v "$PWD/sandbox/service-fixture:/srv/fixture:ro" \
            --entrypoint sh tolmap:after -c 'git config --global --add safe.directory "*" && exec /app/tolmap serve'
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/healthz && break; sleep 1; done
          # Runs one job on the fixture's current HEAD; sets $id, $status and
          # $snapshot.
          run_job() {
            job=$(curl -fsS -X POST -H 'content-type: application/json' \
              -d '{"path":"/srv/fixture"}' http://127.0.0.1:8787/api/index)
            echo "$job"
            id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["job_id"])' <<<"$job")
            for _ in $(seq 1 300); do
              snapshot=$(curl -fsS "http://127.0.0.1:8787/api/jobs/$id")
              status=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$snapshot")
              [ "$status" = done ] || [ "$status" = failed ] && break
              sleep 2
            done
            echo "$snapshot" | python3 -m json.tool | head -80
          }
          run_job
          first_id=$id
          docker logs tolmap-service 2>&1 | tail -40
          [ "$status" = done ]
          python3 - "$snapshot" <<'PY'
          import json, sys
          stages = {row["id"]: row for row in json.loads(sys.argv[1])["stages"]}
          install = stages["install"]
          print("install stage:", install)
          assert install["state"] == "done", install
          PY
          curl -fsS http://127.0.0.1:8787/api/maps/local/fixture -o sandbox/service-map.json
          python3 eval/check_scip_references.py sandbox/service-map.json --expect-install ts=installed

          # Issue #141: a second commit, a small real change -- one new file
          # in `core` importing from it -- so the two jobs index different
          # commits of one repository.
          first_commit=$(git -C sandbox/service-fixture rev-parse HEAD)
          cat > sandbox/service-fixture/packages/core/src/extra.ts <<'TS'
          import { add } from "./math";

          export function twice(value: number): number {
            return add(value, value);
          }
          TS
          git -C sandbox/service-fixture add -A
          git -C sandbox/service-fixture -c user.name=ci -c user.email=ci@example.invalid commit --quiet -m "second commit"
          run_job
          second_id=$id
          docker logs tolmap-service > sandbox/service.log 2>&1 || true
          echo "--- first job's worker log lines ---"
          grep -E "^job $first_id: (warm start|cold start|names cache)" sandbox/service.log || true
          echo "--- second job's worker log lines ---"
          grep -E "^job $second_id: (warm start|cold start|names cache)" sandbox/service.log || true
          [ "$status" = done ]
          curl -fsS http://127.0.0.1:8787/api/maps/local/fixture -o sandbox/service-map-2.json
          python3 - sandbox/service-map.json sandbox/service-map-2.json <<'PY'
          import json, sys
          first, second = (json.load(open(path)) for path in sys.argv[1:])
          print("first commit's district names: ", sorted(first["names"].values()))
          print("second commit's district names:", sorted(second["names"].values()))
          PY
          # A first index has nothing to warm-start from.
          grep -qx "job $first_id: cold start: no previous map" sandbox/service.log
          # The second must have read the first commit's map ...
          if ! grep -qx "job $second_id: warm start from $first_commit" sandbox/service.log; then
            echo "::error::the second job did not warm-start from $first_commit (issue #141)"
            exit 1
          fi
          # ... and had the first job's district names in hand.
          if ! grep -qE "^job $second_id: names cache: [1-9][0-9]* entries in hand$" sandbox/service.log; then
            echo "::error::the second job had no cached district names in hand (issue #141)"
            exit 1
          fi
          # #97 phase 0: a plausible non-zero peak here, through the uid
          # drop this service runs its worker under, is the proof `wait4`
          # (not `RUSAGE_CHILDREN`) works end to end -- print it so it
          # lands in this step's own log rather than only the discarded
          # `sandbox/service.log`.
          echo "--- peak memory log lines ---"
          grep -E "peak memory|no peak memory measured" sandbox/service.log || true
          docker rm -f tolmap-service

      # #97 phase 1: the same two jobs with TOLMAP_WORKERS=loopback:1. The
      # master starts one `tolmap worker --connect` agent on loopback; the
      # agent (root, like the service above) clones, runs the job child as
      # uid 10001, answers its install request with nsjail on its own host,
      # and uploads the artifacts file by file. The master's log must carry
      # the same warm-start, names-cache and peak-memory lines as local
      # mode's, the peak now measured by the agent and sent over the
      # channel.
      - name: "Loopback worker agent: the same SCIP jobs through TOLMAP_WORKERS=loopback:1"
        run: |
          set -euo pipefail
          rm -rf sandbox/loopback-fixture
          cp -r tests/fixtures/scip/ts-workspace sandbox/loopback-fixture
          git -C sandbox/loopback-fixture init --quiet && git -C sandbox/loopback-fixture add -A
          git -C sandbox/loopback-fixture -c user.name=ci -c user.email=ci@example.invalid commit --quiet -m fixture
          docker run -d --name tolmap-loopback --privileged -p 127.0.0.1:8788:8787 \
            -e TOLMAP_WORKERS=loopback:1 \
            -e TOLMAP_REFS=scip -e TOLMAP_SCIP_INSTALL=sandbox -e TOLMAP_BIND_ADDR=0.0.0.0 -e TOLMAP_CACHE_DIR=/srv/cache \
            -v "$PWD/sandbox/loopback-fixture:/srv/fixture:ro" \
            --entrypoint sh tolmap:after -c 'git config --global --add safe.directory "*" && exec /app/tolmap serve'
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8788/api/healthz && break; sleep 1; done
          run_job() {
            job=$(curl -fsS -X POST -H 'content-type: application/json' \
              -d '{"path":"/srv/fixture"}' http://127.0.0.1:8788/api/index)
            echo "$job"
            id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["job_id"])' <<<"$job")
            for _ in $(seq 1 300); do
              snapshot=$(curl -fsS "http://127.0.0.1:8788/api/jobs/$id")
              status=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$snapshot")
              [ "$status" = done ] || [ "$status" = failed ] && break
              sleep 2
            done
            echo "$snapshot" | python3 -m json.tool | head -80
          }
          run_job
          first_id=$id
          docker logs tolmap-loopback 2>&1 | tail -60
          [ "$status" = done ]
          python3 - "$snapshot" <<'PY'
          import json, sys
          stages = {row["id"]: row for row in json.loads(sys.argv[1])["stages"]}
          for stage in ("clone", "install"):
              print(stage, "stage:", stages[stage])
              assert stages[stage]["state"] == "done", stages[stage]
          PY
          curl -fsS http://127.0.0.1:8788/api/maps/local/fixture -o sandbox/loopback-map.json
          python3 eval/check_scip_references.py sandbox/loopback-map.json --expect-install ts=installed

          first_commit=$(git -C sandbox/loopback-fixture rev-parse HEAD)
          cat > sandbox/loopback-fixture/packages/core/src/extra.ts <<'TS'
          import { add } from "./math";

          export function twice(value: number): number {
            return add(value, value);
          }
          TS
          git -C sandbox/loopback-fixture add -A
          git -C sandbox/loopback-fixture -c user.name=ci -c user.email=ci@example.invalid commit --quiet -m "second commit"
          run_job
          second_id=$id
          docker logs tolmap-loopback > sandbox/loopback.log 2>&1 || true
          echo "--- agent and assignment lines ---"
          grep -E "worker agent|assigned to worker agent|worker listener" sandbox/loopback.log || true
          echo "--- the jobs' worker log lines ---"
          grep -E "^job ($first_id|$second_id): (warm start|cold start|names cache)" sandbox/loopback.log || true
          echo "--- peak memory log lines ---"
          grep -E "peak memory|no peak memory measured" sandbox/loopback.log || true
          [ "$status" = done ]
          grep -q "worker listener on http://127.0.0.1:" sandbox/loopback.log
          grep -qE "^worker agent 0 \(agent-[0-9]+\) connected" sandbox/loopback.log
          grep -qx "job $first_id: assigned to worker agent 0 (epoch 1)" sandbox/loopback.log
          grep -qx "job $first_id: cold start: no previous map" sandbox/loopback.log
          if ! grep -qx "job $second_id: warm start from $first_commit" sandbox/loopback.log; then
            echo "::error::the loopback agent's job did not warm-start from $first_commit"
            exit 1
          fi
          if ! grep -qE "^job $second_id: names cache: [1-9][0-9]* entries in hand$" sandbox/loopback.log; then
            echo "::error::the loopback agent's job had no cached district names in hand"
            exit 1
          fi
          # The agent reaps the job child with wait4 and sends the peak on
          # the terminal event; the master logs it as in local mode.
          for id in "$first_id" "$second_id"; do
            if ! grep -qE "^job $id peak memory [0-9]+ MiB" sandbox/loopback.log; then
              echo "::error::no peak memory line for loopback job $id"
              exit 1
            fi
          done
          # SIGTERM: the master fails nothing (both jobs are done), tells the
          # agent `shutdown now`, reaps it, and exits cleanly.
          docker stop tolmap-loopback
          docker logs tolmap-loopback > sandbox/loopback.log 2>&1 || true
          tail -20 sandbox/loopback.log
          grep -q "tolmap serve: shut down cleanly" sandbox/loopback.log
          docker rm -f tolmap-loopback

      - name: Size and time summary
        if: always()
        run: |
          {
            echo "## SCIP worker image (#110 P1b)"
            echo
            echo "| | before (main) | after (this branch) | delta |"
            echo "|---|---:|---:|---:|"
            if [ -n "${BEFORE_SIZE_BYTES:-}" ]; then
              before_mb=$((BEFORE_SIZE_BYTES / 1024 / 1024))
              after_mb=$((AFTER_SIZE_BYTES / 1024 / 1024))
              echo "| image size | ${before_mb} MB | ${after_mb} MB | +$((after_mb - before_mb)) MB |"
              echo "| full build time | ${BEFORE_BUILD_SECONDS}s | ${AFTER_BUILD_SECONDS}s | +$((AFTER_BUILD_SECONDS - BEFORE_BUILD_SECONDS))s |"
            else
              after_mb=$((AFTER_SIZE_BYTES / 1024 / 1024))
              echo "| image size | (not built this run) | ${after_mb} MB | — |"
              echo "| full build time | (not built this run) | ${AFTER_BUILD_SECONDS}s | — |"
            fi
            echo "| \`scip-tools\` stage alone, no cache | — | ${SCIP_TOOLS_BUILD_SECONDS}s | — |"
            echo
            echo "Cold-runner numbers, no layer cache on either side -- a measurement of the pinned stage's real cost, not of a warm incremental rebuild."
          } >> "$GITHUB_STEP_SUMMARY"
